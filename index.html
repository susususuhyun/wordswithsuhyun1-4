<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>워마 중등실력 메타인지 단어장 (Day 4 & 5)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* 부드러운 아코디언 애니메이션 */
        .accordion-content { transition: max-height 0.35s ease-in-out, padding 0.35s ease-in-out, opacity 0.35s ease-in-out; max-height: 0; opacity: 0; overflow: hidden; }
        .accordion-content.open { max-height: 400px; opacity: 1; padding-top: 1rem; padding-bottom: 1rem; }
        
        /* 3D 플래시카드 애니메이션 설정 */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flip-card-inner { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }

        /* 탭 상태 스타일 */
        .tab-btn.active { color: #f43f5e; border-bottom-color: #f43f5e; font-weight: 700; background-color: #fff1f2; }

        /* 모바일 앱 뷰포트 고정 */
        .app-container { max-width: 480px; margin: 0 auto; background-color: #ffffff; min-height: 100vh; position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

<div class="app-container flex flex-col h-screen overflow-hidden">
    
    <header class="bg-slate-900 text-rose-400 p-4 sticky top-0 z-20 flex justify-between items-center shadow-md">
        <div>
            <h1 class="text-xl font-extrabold tracking-wide"><i class="fa-solid fa-shirt mr-2"></i>메타인지 단어장</h1>
            <p class="text-xs text-slate-300 mt-1">중등실력 <span class="text-white font-bold">Day 4 (직업) & Day 5 (패션)</span></p>
        </div>
        <button onclick="toggleMode()" id="modeToggleBtn" class="bg-rose-500 text-white px-4 py-1.5 rounded-full text-sm font-bold shadow-md hover:bg-rose-600 transition">
            <i class="fa-solid fa-layer-group mr-1"></i> 카드모드
        </button>
    </header>

    <!-- 탭 내비게이션 -->
    <div class="flex bg-white shadow-sm sticky top-[72px] z-10 border-b border-slate-200">
        <button id="tab-4" onclick="setLesson(4)" class="tab-btn active flex-1 py-3 text-sm text-slate-500 border-b-2 border-transparent transition duration-200"><i class="fa-solid fa-user-tie mr-1"></i> Day 4 (직업)</button>
        <button id="tab-5" onclick="setLesson(5)" class="tab-btn flex-1 py-3 text-sm text-slate-500 border-b-2 border-transparent transition duration-200"><i class="fa-solid fa-bag-shopping mr-1"></i> Day 5 (패션)</button>
    </div>

    <!-- 메인 리스트 뷰 -->
    <main id="listView" class="flex-1 overflow-y-auto p-4 space-y-5 pb-24 bg-slate-50">
        <!-- JavaScript로 렌더링 -->
    </main>

    <!-- 플래시카드 뷰 (기본 숨김) -->
    <div id="flashcardView" class="hidden absolute inset-0 bg-slate-900/95 z-30 flex-col pb-10 backdrop-blur-sm">
        <div class="flex justify-between items-center p-5 text-white">
            <span id="flashcardCounter" class="text-sm font-bold bg-slate-800 px-4 py-1.5 rounded-full border border-slate-700 text-rose-400 shadow-inner">1 / 30</span>
            <button onclick="toggleMode()" class="text-slate-400 hover:text-rose-400 transition transform hover:rotate-90"><i class="fa-solid fa-xmark text-3xl"></i></button>
        </div>

        <div class="flex-1 flex items-center justify-center p-6 w-full perspective-1000">
            <div id="flashcard" class="w-full h-[65vh] max-w-sm relative transform-style-3d flip-card-inner cursor-pointer" onclick="flipCard()">
                
                <!-- 앞면 -->
                <div class="absolute inset-0 w-full h-full bg-white rounded-3xl shadow-[0_15px_40px_rgba(0,0,0,0.4)] backface-hidden flex flex-col justify-center items-center p-8 text-center border-2 border-slate-100">
                    <span id="cardGroup" class="absolute top-6 text-[0.7rem] font-bold text-rose-600 bg-rose-100 px-3 py-1 rounded-full tracking-wider">그룹</span>
                    <h2 id="cardWord" class="text-4xl font-black text-slate-800 mb-4 tracking-tight break-words">Word</h2>
                    <p class="text-slate-400 text-sm mt-8 font-semibold animate-pulse"><i class="fa-solid fa-rotate mr-2"></i>카드를 뒤집어 해설 확인</p>
                </div>

                <!-- 뒷면 -->
                <div class="absolute inset-0 w-full h-full bg-slate-800 rounded-3xl shadow-[0_15px_40px_rgba(244,63,94,0.3)] backface-hidden rotate-y-180 flex flex-col p-6 text-slate-200 overflow-y-auto border border-rose-500">
                    <h2 id="cardWordBack" class="text-2xl font-bold mb-2 border-b border-slate-600 pb-2 text-rose-400">Word</h2>
                    <p id="cardMeaning" class="text-xl font-black mb-5 text-white">의미</p>
                    
                    <div class="bg-slate-900/60 rounded-xl p-4 mb-4 shadow-inner border border-slate-700">
                        <p class="text-[0.75rem] text-rose-400 mb-2 font-bold uppercase tracking-wider"><i class="fa-solid fa-lightbulb mr-1"></i> 메타인지 어원 스토리</p>
                        <p id="cardRoot" class="text-[0.9rem] leading-relaxed text-slate-300 font-medium break-keep">어원 설명</p>
                    </div>
                    
                    <div class="bg-slate-900/60 rounded-xl p-4 shadow-inner border border-slate-700">
                        <p class="text-[0.75rem] text-slate-400 mb-2 font-bold uppercase tracking-wider"><i class="fa-solid fa-link mr-1"></i> 패밀리 단어 (Cognates)</p>
                        <p id="cardCognates" class="text-sm font-medium text-slate-400">동계어 설명</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 하단 네비게이션 버튼 -->
        <div class="flex justify-center items-center space-x-8 px-6 pb-4">
            <button onclick="prevCard()" class="w-16 h-16 rounded-full bg-slate-800 text-slate-300 flex justify-center items-center active:bg-slate-700 hover:bg-slate-700 transition shadow-lg border border-slate-600 hover:text-rose-400">
                <i class="fa-solid fa-chevron-left text-2xl"></i>
            </button>
            <button onclick="nextCard()" class="w-16 h-16 rounded-full bg-rose-500 text-white flex justify-center items-center active:bg-rose-600 hover:bg-rose-400 transition shadow-[0_0_20px_rgba(244,63,94,0.4)] font-bold">
                <i class="fa-solid fa-chevron-right text-2xl"></i>
            </button>
        </div>
    </div>
</div>

<script>
    const db = {
        // ----------------- [ Day 4: 직업/진로 30단어 ] -----------------
        4: [
            // 그룹 1: 법, 정치, 공공
            { word: "president", meaning: "대통령", root: "pre(앞에) + sidere(앉다) → 무리의 맨 앞자리에 앉아 국가를 주재하는 최고 책임자입니다.", cognates: "preside(주재하다), resident(거주자)", group: "1. 법, 정치, 공공" },
            { word: "lawyer", meaning: "변호사", root: "law(법) + yer(사람) → 고대 노르드어 lag(바탕에 깔린 것)에서 유래하여 사회의 바탕인 법을 다루는 사람입니다.", cognates: "law(법), lawful(합법적인)", group: "1. 법, 정치, 공공" },
            { word: "judge", meaning: "판사, 심사원; 판단하다", root: "jus(법, 올바름) + dicere(말하다) → 법정에서 무엇이 법이고 올바른지 최종적으로 '말해주는' 사람입니다.", cognates: "justice(정의), dictate(구술하다)", group: "1. 법, 정치, 공공" },
            { word: "officer", meaning: "공무원, 관리", root: "opus(일) + facere(하다) → 사적인 일이 아니라 국가나 기관의 공적인 임무(office)를 수행하는 사람입니다.", cognates: "office(사무실), official(공식적인)", group: "1. 법, 정치, 공공" },
            { word: "detective", meaning: "탐정", root: "de(벗기다) + tect(덮다) → 범죄자가 숨기려고 '덮어둔' 진실을 파헤쳐 '벗겨내는' 사람입니다.", cognates: "detect(발견하다), protect(보호하다)", group: "1. 법, 정치, 공공" },
            { word: "soldier", meaning: "군인", root: "solidus(로마 금화) → 로마 시대에 소금이나 땅 대신 직접 '금화'를 월급으로 받고 일하던 용병에서 유래했습니다.", cognates: "solid(단단한 - 금화의 성질)", group: "1. 법, 정치, 공공" },
            { word: "security guard", meaning: "경호원, 경비원", root: "se(없는) + cura(걱정) + guard(지키다) → 고객이 '걱정이 없도록' 지켜주는 사람입니다.", cognates: "secure(안전한), curious(호기심 있는)", group: "1. 법, 정치, 공공" },
            
            // 그룹 2: 과학, 기술, 공학
            { word: "scientist", meaning: "과학자", root: "scire(알다) + ist(사람) → 자연과 우주가 어떻게 돌아가는지 그 이치를 '아는' 사람입니다.", cognates: "science(과학), conscience(양심)", group: "2. 과학, 기술, 공학" },
            { word: "astronaut", meaning: "우주비행사", root: "astron(별) + nautes(선원) → 바다가 아니라 우주의 '별' 사이를 항해하는 특별한 선원입니다.", cognates: "astronomy(천문학), navy(해군)", group: "2. 과학, 기술, 공학" },
            { word: "engineer", meaning: "기사, 기술자", root: "ingenium(타고난 재능, 발명) + eer → 고대에 공성 무기나 기계를 다루는 '천재적인 재능'을 가진 사람을 뜻했습니다.", cognates: "engine(엔진), genius(천재)", group: "2. 과학, 기술, 공학" },
            { word: "mechanic", meaning: "정비공", root: "mechos(기계, 수단) + ic → 자동차나 기계가 작동하는 원리와 구조를 다룰 줄 아는 기술자입니다.", cognates: "machine(기계), mechanism(기계 장치)", group: "2. 과학, 기술, 공학" },
            { word: "architect", meaning: "건축가", root: "archi(최고의) + tekton(목수) → 건물을 지을 때 일하는 모든 기술자들을 지휘하는 '수석 목수'입니다.", cognates: "archangel(대천사), technology(기술)", group: "2. 과학, 기술, 공학" },

            { word: "dentist", meaning: "치과의사", root: "dens(치아) + ist(사람) → 인간의 '치아'와 관련된 의학적 지식을 다루는 전문가입니다.", cognates: "dental(치과의), indent(들여쓰기 하다)", group: "2. 과학, 기술, 공학" },

            // 그룹 3: 기록, 교육, 언어
            { word: "professor", meaning: "교수", root: "pro(앞에서) + fateri(말하다) → 학생들 '앞에서' 자신의 학문과 사상을 공개적으로 '선언하며' 가르치는 사람입니다.", cognates: "profess(공언하다), confess(고백하다)", group: "3. 기록, 교육, 언어" },
            { word: "novelist", meaning: "소설가", root: "novus(새로운) + ist(사람) → 기존의 역사적 사실이 아닌, 상상력으로 만들어낸 '새로운' 이야기를 쓰는 사람입니다.", cognates: "novel(소설, 새로운), renovate(개조하다)", group: "3. 기록, 교육, 언어" },

            { word: "reporter", meaning: "기자, 통신원", root: "re(다시) + portare(나르다) → 사건 현장에서 벌어진 일을 취재하여 신문이나 방송을 통해 '다시 실어 나르는' 사람입니다.", cognates: "report(보고하다), transport(수송하다)", group: "3. 기록, 교육, 언어" },
            { word: "secretary", meaning: "비서", root: "secret(비밀) + ary(사람) → 예전에 왕이나 귀족의 가장 중요한 '비밀 문서'를 관리하던 고위직에서 유래했습니다.", cognates: "secret(비밀)", group: "3. 기록, 교육, 언어" },
            { word: "accountant", meaning: "회계사", root: "ad(~에) + computare(계산하다) → 장부상에 돈이 들어오고 나가는 것을 정확히 '계산하는' 사람입니다.", cognates: "account(계좌, 설명), computer(컴퓨터)", group: "3. 기록, 교육, 언어" },

            // 그룹 4: 예술, 상업, 일상
            { word: "photographer", meaning: "사진사, 사진작가", root: "phos(빛) + graph(그리다) + er → 붓과 물감이 아니라 카메라로 들어오는 '빛'을 이용해 그림을 그리는 예술가입니다.", cognates: "photo(사진), paragraph(단락)", group: "4. 예술, 상업, 일상" },
            { word: "illustrator", meaning: "삽화가", root: "in(안에) + lustrare(빛나게 하다) → 글만 있어서 어두운 책 속에 그림을 그려 내용을 환하게 '빛을 비추는' 사람입니다.", cognates: "illustrate(설명하다), illusion(환상)", group: "4. 예술, 상업, 일상" },

            { word: "businessman", meaning: "사업가", root: "busy(바쁜) + ness + man → 이윤을 창출하기 위해 회사 일로 항상 '바쁘게' 움직이는 사람입니다.", cognates: "busy(바쁜), business(사업)", group: "4. 예술, 상업, 일상" },
            { word: "salesperson", meaning: "판매원", root: "sale(판매) + person(사람) → 고객을 응대하고 물건을 '파는(sell)' 역할을 맡은 사람입니다.", cognates: "sell(팔다), sale(판매)", group: "4. 예술, 상업, 일상" },
            { word: "baker", meaning: "제빵사", root: "bacan(굽다) + er(사람) → 고대 영어에서 유래하여 오븐에서 밀가루 반죽을 '구워내는' 사람을 뜻합니다.", cognates: "bake(굽다), bakery(빵집)", group: "4. 예술, 상업, 일상" },
            { word: "fisherman", meaning: "어부", root: "fish(물고기) + er + man → 강이나 바다에서 그물이나 낚시로 '물고기를 잡는' 사람입니다.", cognates: "fish(물고기), fishery(어업)", group: "4. 예술, 상업, 일상" },
            { word: "gardener", meaning: "정원사", root: "garden(정원) + er → garden은 원래 짐승이 못 들어오게 '울타리를 친 곳'이었으며, 이곳에 식물을 가꾸는 사람입니다.", cognates: "guard(지키다)", group: "4. 예술, 상업, 일상" },

        // ----------------- [ Day 5: 옷/패션/잡화 30단어 ] -----------------

            // 그룹 1: 겉옷과 정장

            { word: "uniform", meaning: "유니폼, 제복", root: "uni(하나의) + form(형태) → 소속감을 주기 위해 모두가 '단 하나의 같은 형태'로 통일해서 입는 옷입니다.", cognates: "unicorn(유니콘), form(형태)", group: "1. 겉옷과 정장" },
            { word: "suit", meaning: "정장, 슈트; ~에게 잘 어울리다", root: "sequi(따르다) → 상의와 하의가 짝짝이가 아니라 같은 천으로 만들어 서로 셋트로 '따라가는' 옷입니다.", cognates: "pursue(추구하다), sequence(연속)", group: "1. 겉옷과 정장" },
            { word: "vest", meaning: "조끼", root: "vestis(옷) → 고대 로마 시대에는 일반적인 겉옷을 의미했지만, 점차 속옷과 겉옷 사이에 덧입는 옷으로 의미가 좁혀졌습니다.", cognates: "invest(투자하다 - 돈이라는 옷을 입히다)", group: "1. 겉옷과 정장" },
            { word: "dress", meaning: "옷, 의복; 옷을 입다", root: "directus(똑바른) → 군대에서 대열을 똑바로 맞추거나 매무새를 단정히 가다듬는 행위에서 '옷을 잘 챙겨 입다'로 뜻이 변했습니다.", cognates: "direct(직접적인, 지시하다)", group: "1. 겉옷과 정장" },

            // 그룹 2: 바지와 치마
            { word: "jeans", meaning: "청바지", root: "이탈리아의 항구 도시 '제노바(Genoa)'를 프랑스어로 젠느라고 불렀는데, 그곳 선원들이 입던 질긴 텐트 천으로 만든 바지에서 유래했습니다.", cognates: "Genoa(제노바)", group: "2. 바지와 치마" },
            { word: "pants", meaning: "바지", root: "이탈리아 코미디 극에서 헐렁한 바지를 입고 나오던 우스꽝스러운 구두쇠 할아버지 캐릭터 '판탈로네(Pantalone)'의 이름에서 따온 단어입니다.", cognates: "panties(팬티)", group: "2. 바지와 치마" },
            { word: "shorts", meaning: "반바지, 운동 팬츠", root: "short(짧은) + s(복수형) → 다리 통이 2개라서 항상 복수형(-s)으로 씁니다. 길이가 짧게 잘린 바지를 뜻합니다.", cognates: "short(짧은), shorten(짧게 하다)", group: "2. 바지와 치마" },
            { word: "skirt", meaning: "치마", root: "고대 북유럽어 skyrta(짧은 튜닉)에서 유래. 셔츠(shirt)와 어원이 완전히 같으나, 상체로 가면 셔츠, 하체로 가면 스커트가 되었습니다.", cognates: "shirt(셔츠)", group: "2. 바지와 치마" },
            { word: "overalls", meaning: "멜빵 바지", root: "over(위에) + all(모든 것) + s → 작업할 때 원래 입던 옷들이 더러워지지 않게 '모든 옷 그 위에' 덮어서 입는 작업복 바지입니다.", cognates: "over(위에), all(모든)", group: "2. 바지와 치마" },

            // 그룹 3: 신발과 잡화
            { word: "boots", meaning: "장화, 부츠, 목이 긴 구두", root: "고대 프랑스어 botte(두꺼운 신발)에서 유래. 진흙이나 눈으로부터 발과 종아리를 보호하기 위해 목이 길게 만들어진 신발입니다.", cognates: "boot(장화)", group: "3. 신발과 잡화" },
            { word: "heels", meaning: "굽 높은 구두", root: "고대 영어 hela(발뒤꿈치). 신발에서 발뒤꿈치를 받치는 부분을 뜻하다가, 나중에는 아예 굽이 높은 구두 전체를 부르는 말이 되었습니다.", cognates: "heel(발뒤꿈치)", group: "3. 신발과 잡화" },
            { word: "sandals", meaning: "샌들", root: "그리스어 sandalon(나무 판자 신발). 고대인들이 발바닥을 보호하기 위해 나무 판자나 가죽을 발에 끈으로 묶고 다니던 것에서 유래했습니다.", cognates: "sandalwood(백단향 - 향나무)", group: "3. 신발과 잡화" },
            { word: "athletic shoes", meaning: "운동화", root: "athlete(운동선수) + shoes → 평상화가 아니라 운동 경기나 훈련을 할 때 선수들이 신는 전문적인 신발을 의미합니다.", cognates: "athlete(운동선수), athletic(운동의)", group: "3. 신발과 잡화" },
            { word: "purse", meaning: "돈주머니, 지갑", root: "그리스어 bursa(가죽) → 옛날에는 동전을 넣고 다니기 위해 가죽을 둥글게 기워서 만든 작은 주머니를 사용했습니다.", cognates: "bursar(대학의 회계 담당자)", group: "3. 신발과 잡화" },
            { word: "wallet", meaning: "지갑", root: "고대 독일어 wall(말려 있는 것) → 원래는 순례자들이 짐을 넣고 둘둘 말아서 다니던 가방이었으나, 지폐를 접어 넣는 지갑으로 변했습니다.", cognates: "wall(벽 - 둥글게 둘러싸인 것)", group: "3. 신발과 잡화" },
            { word: "gloves", meaning: "장갑", root: "고대 영어 glof(손바닥). 추위나 거친 작업으로부터 손바닥과 손가락을 보호하기 위해 씌우는 덮개입니다.", cognates: "glove(장갑)", group: "3. 신발과 잡화" },
            { word: "scarf", meaning: "스카프, 목도리", root: "프랑스어 escharpe(지갑을 묶는 끈) → 순례자들이 지갑을 어깨에 매던 끈에서 유래하여, 지금은 목에 두르는 장식용 천이 되었습니다.", cognates: "scrape(긁다)", group: "3. 신발과 잡화" },
            { word: "stockings", meaning: "긴 양말, 스타킹", root: "고대 영어 stocc(통나무) → 옛날 사람들은 다리를 통나무와 같다고 생각했습니다. 다리(통나무) 전체를 덮는 덧신이란 뜻입니다.", cognates: "stock(재고, 줄기)", group: "3. 신발과 잡화" },
            { word: "socks", meaning: "양말", root: "라틴어 soccus. 고대 로마 시대에 희극 배우들이 무대 위에서 폴짝폴짝 뛰기 위해 신던 가볍고 부드러운 굽 낮은 신발에서 유래했습니다.", cognates: "sock(양말)", group: "3. 신발과 잡화" },

            // 그룹 4: 소재와 디테일
            { word: "material", meaning: "직물, 천; 재료", root: "mater(어머니) → 생명을 낳는 어머니처럼, 어떤 사물을 만들어내는 가장 기본적이고 근원이 되는 뼈대나 천 조각을 의미합니다.", cognates: "mother(어머니), matter(물질)", group: "4. 소재와 디테일" },
            { word: "button", meaning: "단추; ~에 단추를 채우다", root: "프랑스어 bouter(밀다) → 단추 구멍 안으로 둥근 조각을 꾹꾹 '밀어 넣어' 옷을 잠그는 행동에서 유래한 단어입니다.", cognates: "butt(밀다, 머리로 들이받다)", group: "4. 소재와 디테일" },
            { word: "belt", meaning: "벨트, 허리띠", root: "라틴어 balteus(검대) → 로마 군인들이 무거운 칼을 차기 위해 허리나 어깨에 튼튼하게 두르던 가죽 띠에서 유래했습니다.", cognates: "belt(띠)", group: "4. 소재와 디테일" },
            { word: "tie", meaning: "넥타이; ~을 묶다, 매다", root: "고대 영어 teag(밧줄). 목에 둘러서 밧줄처럼 묶는 매듭을 의미하며, 여기서 넥타이라는 뜻이 파생되었습니다.", cognates: "tie(묶다, 무승부)", group: "4. 소재와 디테일" },
            { word: "bow tie", meaning: "나비넥타이", root: "bow(활) + tie(묶다) → 목에 매듭을 지어 묶어 놓은 모양이 나비나 사냥할 때 쓰는 '활(bow)'의 휘어진 모양을 닮아서 붙은 이름입니다.", cognates: "bow(활, 인사하다)", group: "4. 소재와 디테일" },
            { word: "pocket", meaning: "주머니", root: "프랑스어 poque(자루) + et(작은) → 짐을 넣는 커다란 자루가 아니라, 옷에 달려 있는 '아주 작은 자루(주머니)'라는 뜻입니다.", cognates: "pouch(작은 주머니), poke(찌르다)", group: "4. 소재와 디테일" },

            // 그룹 5: 옷 입기 구동사
            { word: "put on", meaning: "(옷을) 입다, (모자, 안경 등을) 쓰다", root: "put(놓다) + on(몸 위에 접촉하여) → 옷이나 안경 같은 물건을 내 몸 위에 '올려놓아 딱 붙게(on)' 하는 동작입니다.", cognates: "put(놓다), on(~위에)", group: "5. 옷 입기 구동사" },
            { word: "take off", meaning: "(옷 등을) 벗다; 이륙하다", root: "take(잡다) + off(떨어져) → 몸에 붙어있는 옷을 내 손으로 '잡아서' 몸에서 '떨어지게(off)' 떼어내는 동작입니다. 비행기가 땅에서 떨어질 때도 씁니다.", cognates: "take(잡다), off(분리된)", group: "5. 옷 입기 구동사" },
            { word: "try on", meaning: "~을 입어 [신어] 보다", root: "try(시도하다) + on(몸에 접촉하여) → 이 옷이 나에게 잘 맞는지 알기 위해 내 몸에 직접 붙여(on) '시도해(try)' 보는 것입니다.", cognates: "try(시도하다), trial(시험)", group: "5. 옷 입기 구동사" }
        ]
    };

    let currentLesson = 4; // 기본 선택 단원
    let currentCardIndex = 0;
    let isFlipped = false;
    let currentFlatWordList = [];

    // --- 단원(탭) 변경 로직 ---
    function setLesson(lessonNumber) {
        currentLesson = lessonNumber;
        currentCardIndex = 0;

        // 탭 UI 업데이트
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
            btn.classList.replace('text-rose-500', 'text-slate-500');
            btn.classList.replace('border-rose-500', 'border-transparent');
            btn.classList.remove('bg-rose-50');
        });
        const activeTab = document.getElementById(`tab-${lessonNumber}`);
        activeTab.classList.add('active');
        activeTab.classList.replace('text-slate-500', 'text-rose-500');
        activeTab.classList.replace('border-transparent', 'border-rose-500');
        activeTab.classList.add('bg-rose-50');

        renderList();
    }

    // --- 리스트 렌더링 (아코디언 버그 수정됨) ---
    function renderList() {
        const listView = document.getElementById('listView');
        let htmlContent = '';
        const words = db[currentLesson];
        currentFlatWordList = words; 

        // 그룹별 데이터 분류
        const groupedData = words.reduce((acc, word) => {
            if (!acc[word.group]) acc[word.group] = [];
            acc[word.group].push(word);
            return acc;
        }, {});

        // 버그 해결을 위한 전역 카운터 (그룹 상관없이 0~29까지 순차 증가)
        let globalWordIndex = 0;

        for (const [groupName, groupWords] of Object.entries(groupedData)) {
            // 그룹명에서 번호 제거하여 깔끔하게 표시
            const cleanGroupName = groupName.replace(/^\d+\.\s*/, '');
            
            htmlContent += `
                <div class="mb-6">
                    <h2 class="text-sm font-bold text-slate-700 uppercase mb-3 px-1 border-l-4 border-rose-500 pl-3 flex items-center">
                        <i class="fa-solid ${currentLesson === 4 ? 'fa-briefcase' : 'fa-tags'} mr-2 text-rose-500"></i> ${cleanGroupName}
                    </h2>
                    <div class="space-y-3">
            `;
            
            groupWords.forEach((item) => {
                // 완벽히 고유한 ID 생성
                const id = `word-${currentLesson}-${globalWordIndex++}`;
                
                htmlContent += `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden transform transition hover:-translate-y-0.5 hover:shadow-md">
                        <div class="p-4 flex justify-between items-center cursor-pointer hover:bg-slate-50 transition" onclick="toggleAccordion('${id}')">
                            <div>
                                <h3 class="text-lg font-bold text-slate-800">${item.word}</h3>
                                <p class="text-[0.9rem] text-slate-500 mt-1 font-medium">${item.meaning}</p>
                            </div>
                            <div class="text-rose-500 bg-rose-50 w-8 h-8 flex items-center justify-center rounded-full">
                                <i id="icon-${id}" class="fa-solid fa-chevron-down transition-transform duration-300 text-sm"></i>
                            </div>
                        </div>
                        
                        <div id="content-${id}" class="accordion-content bg-slate-50 px-4 border-t border-slate-100">
                            <div class="mb-4 pt-2">
                                <span class="inline-block bg-rose-100 text-rose-700 text-xs px-2 py-1 rounded font-bold mb-2">
                                    <i class="fa-solid fa-lightbulb mr-1"></i>어원스토리
                                </span>
                                <p class="text-sm text-slate-700 leading-relaxed font-medium break-keep">${item.root}</p>
                            </div>
                            <div class="pb-3">
                                <span class="inline-block bg-slate-200 text-slate-600 text-xs px-2 py-1 rounded font-bold mb-1">
                                    <i class="fa-solid fa-link mr-1"></i>패밀리 단어
                                </span>
                                <p class="text-[0.85rem] text-slate-500 font-semibold">${item.cognates}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
            htmlContent += `</div></div>`;
        }
        listView.innerHTML = htmlContent;
        updateFlashcard();
    }

    // --- 아코디언 동작 제어 ---
    function toggleAccordion(id) {
        const content = document.getElementById(`content-${id}`);
        const icon = document.getElementById(`icon-${id}`);
        
        if (content.classList.contains('open')) {
            content.classList.remove('open');
            icon.classList.remove('rotate-180');
        } else {
            content.classList.add('open');
            icon.classList.add('rotate-180');
        }
    }

    // --- 화면 모드 토글 (리스트 <-> 플래시카드) ---
    function toggleMode() {
        const flashcardView = document.getElementById('flashcardView');
        const modeBtn = document.getElementById('modeToggleBtn');
        
        if (flashcardView.classList.contains('hidden')) {
            flashcardView.classList.remove('hidden');
            flashcardView.classList.add('flex');
            modeBtn.innerHTML = '<i class="fa-solid fa-list mr-1"></i> 목록보기';
            updateFlashcard();
        } else {
            flashcardView.classList.add('hidden');
            flashcardView.classList.remove('flex');
            modeBtn.innerHTML = '<i class="fa-solid fa-layer-group mr-1"></i> 카드모드';
        }
    }

    // --- 플래시카드 내용 갱신 ---
    function updateFlashcard() {
        const item = currentFlatWordList[currentCardIndex];
        const cleanGroupName = item.group.replace(/^\d+\.\s*/, '');
        
        document.getElementById('cardGroup').innerText = `Day ${currentLesson} - ${cleanGroupName}`;
        document.getElementById('cardWord').innerText = item.word;
        document.getElementById('cardWordBack').innerText = item.word;
        document.getElementById('cardMeaning').innerText = item.meaning;
        document.getElementById('cardRoot').innerText = item.root;
        document.getElementById('cardCognates').innerText = item.cognates;
        
        document.getElementById('flashcardCounter').innerText = `${currentCardIndex + 1} / ${currentFlatWordList.length}`;
        
        // 카드 넘길 때 항상 앞면으로 리셋
        if(isFlipped) {
            document.getElementById('flashcard').classList.remove('rotate-y-180');
            isFlipped = false;
        }
    }

    // --- 카드 뒤집기 ---
    function flipCard() {
        const card = document.getElementById('flashcard');
        isFlipped = !isFlipped;
        if (isFlipped) {
            card.classList.add('rotate-y-180');
        } else {
            card.classList.remove('rotate-y-180');
        }
    }

    // --- 이전/다음 카드 ---
    function prevCard() {
        currentCardIndex = (currentCardIndex > 0) ? currentCardIndex - 1 : currentFlatWordList.length - 1;
        updateFlashcard();
    }

    function nextCard() {
        currentCardIndex = (currentCardIndex < currentFlatWordList.length - 1) ? currentCardIndex + 1 : 0;
        updateFlashcard();
    }

    // 초기화
    window.onload = () => {
        setLesson(4); // 앱 실행 시 Day 4 기본 선택
    };
</script>
</body>
</html>
