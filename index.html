<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>워마 중등실력 어원 단어장 (Day 1~2)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 폰트 및 앱 컨테이너 설정 */
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f0fdf4; overflow-x: hidden; margin: 0; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* 아코디언 애니메이션 (단어 상세 정보) */
        .accordion-content { transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), padding 0.35s ease, opacity 0.35s ease; max-height: 0; opacity: 0; overflow: hidden; }
        .accordion-content.open { max-height: 400px; opacity: 1; padding-top: 1rem; padding-bottom: 1rem; }
        
        /* 3D 플래시카드 애니메이션 */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flip-card-inner { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }

        /* 네비게이션 탭 액티브 스타일 */
        .tab-btn.active { color: #16a34a; border-bottom-color: #16a34a; font-weight: 700; background-color: #dcfce7; }

        /* 모바일 최적화 컨테이너 */
        .app-container { max-width: 480px; margin: 0 auto; background-color: #ffffff; min-height: 100vh; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="app-container flex flex-col h-screen overflow-hidden">
    
    <!-- 상단 헤더 -->
    <header class="bg-green-600 text-white p-4 sticky top-0 z-20 flex justify-between items-center shadow-lg">
        <div>
            <h1 class="text-xl font-extrabold tracking-tight"><i class="fa-solid fa-leaf mr-2"></i>워마 어원 단어장</h1>
            <p class="text-xs text-green-200 mt-1 font-medium">중등 실력 (Day 1 - 2)</p>
        </div>
        <button onclick="toggleMode()" id="modeToggleBtn" class="bg-white text-green-600 px-4 py-1.5 rounded-full text-sm font-bold shadow-md hover:bg-green-50 transition transform active:scale-95">
            <i class="fa-solid fa-layer-group mr-1"></i> 카드모드
        </button>
    </header>

    <!-- Day 1, Day 2 탭 -->
    <div class="flex bg-white shadow-sm sticky top-[72px] z-10 border-b border-gray-200">
        <button id="tab-1" onclick="setLesson(1)" class="tab-btn active flex-1 py-3.5 text-sm text-gray-500 border-b-2 border-transparent transition duration-200">Day 1 (성격·기질)</button>
        <button id="tab-2" onclick="setLesson(2)" class="tab-btn flex-1 py-3.5 text-sm text-gray-500 border-b-2 border-transparent transition duration-200">Day 2 (외모·특징)</button>
    </div>

    <!-- 리스트 뷰 영역 -->
    <main id="listView" class="flex-1 overflow-y-auto p-4 space-y-6 pb-24 bg-gray-50">
        <!-- JS로 동적 렌더링 -->
    </main>

    <!-- 플래시카드 뷰 영역 -->
    <div id="flashcardView" class="hidden absolute inset-0 bg-gray-900 bg-opacity-95 z-30 flex-col pb-10">
        <div class="flex justify-between items-center p-5 text-white">
            <span id="flashcardCounter" class="text-sm font-bold bg-gray-800 px-4 py-1.5 rounded-full border border-gray-600 shadow-inner">1 / 30</span>
            <button onclick="toggleMode()" class="text-gray-400 hover:text-white transition transform hover:rotate-90"><i class="fa-solid fa-xmark text-3xl"></i></button>
        </div>

        <div class="flex-1 flex items-center justify-center p-6 w-full perspective-1000">
            <div id="flashcard" class="w-full h-[65vh] max-w-sm relative transform-style-3d flip-card-inner cursor-pointer" onclick="flipCard()">
                
                <!-- 플래시카드 앞면 -->
                <div class="absolute inset-0 w-full h-full bg-white rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.3)] backface-hidden flex flex-col justify-center items-center p-8 text-center border-b-8 border-green-500">
                    <span id="cardGroup" class="absolute top-6 text-xs font-bold text-green-700 bg-green-100 px-3 py-1 rounded-full border border-green-200">그룹명</span>
                    <h2 id="cardWord" class="text-5xl font-black text-gray-800 mb-4 tracking-tight">Word</h2>
                    <p class="text-gray-400 text-sm mt-6 font-medium animate-bounce"><i class="fa-solid fa-hand-pointer mr-2"></i>카드를 눌러 뒤집기</p>
                </div>

                <!-- 플래시카드 뒷면 -->
                <div class="absolute inset-0 w-full h-full bg-green-600 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.3)] backface-hidden rotate-y-180 flex flex-col p-8 text-white overflow-y-auto border-b-8 border-green-800">
                    <h2 id="cardWordBack" class="text-2xl font-bold mb-2 border-b border-green-400 pb-2">Word</h2>
                    <p id="cardMeaning" class="text-2xl font-black mb-6 text-yellow-300">의미</p>
                    
                    <div class="bg-green-800 bg-opacity-40 rounded-xl p-4 mb-4 shadow-inner">
                        <p class="text-xs text-green-200 mb-1.5 font-bold uppercase tracking-wider"><i class="fa-solid fa-lightbulb mr-1 text-yellow-300"></i> 어원 스토리</p>
                        <p id="cardRoot" class="text-sm leading-relaxed text-gray-100">어원 설명</p>
                    </div>
                    
                    <div class="bg-green-800 bg-opacity-40 rounded-xl p-4 shadow-inner">
                        <p class="text-xs text-green-200 mb-1.5 font-bold uppercase tracking-wider"><i class="fa-solid fa-link mr-1 text-blue-300"></i> 동계어 (Family)</p>
                        <p id="cardCognates" class="text-sm font-medium text-gray-100">동계어 설명</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 하단 좌우 네비게이션 버튼 -->
        <div class="flex justify-center items-center space-x-8 px-6 pb-4">
            <button onclick="prevCard()" class="w-16 h-16 rounded-full bg-gray-800 text-white flex justify-center items-center active:bg-gray-700 hover:bg-gray-700 transition transform active:scale-90 border border-gray-600 shadow-xl">
                <i class="fa-solid fa-chevron-left text-2xl"></i>
            </button>
            <button onclick="nextCard()" class="w-16 h-16 rounded-full bg-green-500 text-white flex justify-center items-center active:bg-green-400 hover:bg-green-400 transition transform active:scale-90 shadow-[0_0_20px_rgba(34,197,94,0.4)]">
                <i class="fa-solid fa-chevron-right text-2xl"></i>
            </button>
        </div>
    </div>
</div>

<script>
    // Day 1, Day 2 완벽 분리 데이터베이스 (총 60개)
    // '어원과 의미 확장의 스토리(Semantic Shift)'를 꼼꼼하게 작성했습니다.
    const db = {
        // ----------------- [ Day 1: 성격, 기질 (30단어) ] -----------------
        1: [
            // 그룹 1: 긍정과 신뢰의 태도 (-pos-, -fid-, -gen-)
            { word: "positive", meaning: "긍정적인", root: "pos(놓다, 두다) + itive → 어떤 사실을 있는 그대로 확고하게 제자리에 '내려놓고' 인정하는 태도에서 '긍정적인'이라는 뜻이 되었습니다.", cognates: "position(위치), deposit(예금하다)", group: "1. 긍정과 신뢰의 태도 (-pos-, -fid-)" },
            { word: "confident", meaning: "자신만만한, 확신하는", root: "con(완전히) + fid(믿다) + ent → 내 능력이나 상황을 '완전히 믿는' 상태이므로, '자신만만하고 확신에 찬' 성격을 나타냅니다.", cognates: "fidelity(충실함), confide(털어놓다)", group: "1. 긍정과 신뢰의 태도 (-pos-, -fid-)" },
            { word: "generous", meaning: "관대한, (인심이) 후한", root: "gen(혈통, 가문) + erous → 옛날 뼈대 있는 명문 귀족(가문) 출신 사람들은 베풀 줄 안다는 생각에서 유래하여 '관대하고 후한'이라는 뜻이 생겼습니다.", cognates: "gentle(온화한), gene(유전자)", group: "1. 긍정과 신뢰의 태도 (-pos-, -fid-)" },
            { word: "optimistic", meaning: "낙관적인, 낙천적인", root: "optimus(최상의) + istic → 앞으로 일어날 일들이 모두 '가장 좋은(최상의)' 방향으로 흘러갈 것이라고 믿는 긍정적인 심리 상태입니다.", cognates: "optimal(최적의), optimum(최고의 상태)", group: "1. 긍정과 신뢰의 태도 (-pos-, -fid-)" },
            { word: "brave", meaning: "용감한", root: "라틴어 barbarus(야만적인)에서 유래 → 문명화되지 않은 거칠고 두려움 없는 모습에서 '용감하고 용맹한'이라는 긍정적 의미로 진화했습니다.", cognates: "barbarian(야만인)", group: "1. 긍정과 신뢰의 태도 (-pos-, -fid-)" },
            { word: "active", meaning: "활동적인, 적극적인", root: "act(행동하다) + ive → 가만히 머물러 있지 않고 스스로 끊임없이 움직이며 '행동으로 옮기는' 성향입니다.", cognates: "action(행동), actor(배우)", group: "1. 긍정과 신뢰의 태도 (-pos-, -fid-)" },
            { word: "cheerful", meaning: "쾌활한, 명랑한", root: "cheer(얼굴 표정 → 환호) + ful(가득 찬) → 원래 cheer는 '얼굴 표정'을 뜻했는데, 얼굴에 기쁨이 '가득 차서' 환호하는 '명랑한' 상태가 되었습니다.", cognates: "cheer(환호), cheer up", group: "1. 긍정과 신뢰의 태도 (-pos-, -fid-)" },
            
            // 그룹 2: 지혜와 신중함 (-wis-, -caut-, -mod-)
            { word: "wise", meaning: "지혜로운, 슬기로운", root: "고대 영어 wid(알다, 보다) → 많은 것을 직접 보고 경험하여 세상 이치를 깊이 '알고 있는' 상태에서 '지혜롭다'는 뜻이 나왔습니다.", cognates: "vision(시야), witness(목격자)", group: "2. 지혜와 신중함 (-wis-, -caut-)" },
            { word: "calm", 실력: "차분한, 침착한", meaning: "차분한, 침착한", root: "그리스어 cauma(한낮의 열기) → 아주 더운 한낮에는 사람들이 모든 활동을 멈추고 그늘에서 쉬는 '고요한' 풍경에서 유래했습니다.", cognates: "calmness(고요함)", group: "2. 지혜와 신중함 (-wis-, -caut-)" },
            { word: "modest", meaning: "겸손한, 신중한; 중도적인", root: "mod(척도, 기준) + est → 겉멋을 부리거나 도를 넘지 않고, 알맞은 '기준과 선'을 지킬 줄 아는 '겸손한' 태도입니다.", cognates: "moderate(적당한), modern(현대의)", group: "2. 지혜와 신중함 (-wis-, -caut-)" },
            { word: "careful", meaning: "조심성 있는", root: "care(주의, 걱정) + ful(가득 찬) → 행동 하나하나에 '걱정과 주의'를 꽉 채워서 실수하지 않으려는 성격입니다.", cognates: "careless(부주의한)", group: "2. 지혜와 신중함 (-wis-, -caut-)" },
            { word: "cautious", meaning: "조심스러운, 신중한, 조심하는", root: "caut(주의하다, 경계하다) + ious → 잠재적인 위험을 미리 살피고 한 발짝 물러서서 '경계하는' 매우 신중한 태도입니다.", cognates: "precaution(예방조치)", group: "2. 지혜와 신중함 (-wis-, -caut-)" },
            { word: "honest", meaning: "정직한, 솔직한", root: "honor(명예) + est → 남을 속이거나 거짓말을 하지 않음으로써 스스로의 '명예'를 당당하게 지키는 사람의 특성입니다.", cognates: "honor(명예), honorable(명예로운)", group: "2. 지혜와 신중함 (-wis-, -caut-)" },
            { word: "serious", meaning: "진지한, 진심의", root: "라틴어 serius(무거운) → 태도나 생각이 결코 가볍지 않고 묵직하여 얕은 장난이 없는 '진지한' 상태를 말합니다.", cognates: "gravity(중력 - 무거움과 연관된 개념)", group: "2. 지혜와 신중함 (-wis-, -caut-)" },
            { word: "character", meaning: "성격, 기질", root: "char(새기다) + acter → 돌이나 동전에 문양을 깊게 새겨 넣듯이, 사람의 내면에 쉽게 변하지 않도록 깊게 새겨진 고유한 '성격'을 뜻합니다.", cognates: "characteristic(특성)", group: "2. 지혜와 신중함 (-wis-, -caut-)" },

            // 그룹 3: 부정적인 성향 (-neg-, -strict-, -cru-)
            { word: "negative", meaning: "부정적인", root: "neg(부인하다, 거절하다) + ative → 남의 의견이나 주어진 상황에 대해 '아니다'라고 거부부터 하는 성향입니다.", cognates: "neglect(방치하다), deny(부인하다)", group: "3. 부정적 성향 (-neg-, -cru-)" },
            { word: "strict", meaning: "엄한, 엄격한", root: "strict(팽팽하게 당기다) → 느슨하게 풀어주지 않고 규칙의 끈을 '팽팽하게 꽉 조여' 융통성을 주지 않는 '엄격함'입니다.", cognates: "stress(스트레스), restrict(제한하다)", group: "3. 부정적 성향 (-neg-, -cru-)" },
            { word: "cruel", meaning: "잔인한, 무자비한", root: "crud(생피가 흐르는) + el → 피가 뚝뚝 떨어지는 날것을 보고도 눈 하나 깜짝하지 않는 무자비하고 '가혹한' 모습에서 유래했습니다.", cognates: "crude(가공되지 않은, 거친)", group: "3. 부정적 성향 (-neg-, -cru-)" },
            { word: "mean", meaning: "못된, 심술궂은", root: "원래 '중간의' → '너무 흔하고 평범한' → '가치 없고 비천한'을 거쳐 남을 괴롭히는 '심술궂고 비열한' 성격으로 의미가 하락했습니다.", cognates: "meanwhile(그 동안에 - '중간'의 의미 유지)", group: "3. 부정적 성향 (-neg-, -cru-)" },
            { word: "rude", meaning: "무례한, 예의 없는", root: "rud(다듬어지지 않은) → 교양이나 예절 교육을 받지 않아 마치 껍질을 벗기지 않은 거친 통나무처럼 '무례한' 상태입니다.", cognates: "crude(다듬어지지 않은), erudite(학식있는 - rud를 벗어난)", group: "3. 부정적 성향 (-neg-, -cru-)" },
            { word: "selfish", meaning: "이기적인", root: "self(자기 자신) + ish(~같은) → 타인은 배려하지 않고 오직 자기 자신(self)의 이익만을 최우선으로 챙기는 성향입니다.", cognates: "selfless(이타적인)", group: "3. 부정적 성향 (-neg-, -cru-)" },
            { word: "proud", meaning: "자랑스러워하는; 거만한, 잘난 체하는", root: "pro(앞으로) + ud(뛰어난) → 자신이 남들보다 뛰어나다고 생각하여 무리의 '맨 앞으로' 나서서 우쭐대는 성격입니다.", cognates: "pride(자부심)", group: "3. 부정적 성향 (-neg-, -cru-)" },
            { word: "lazy", meaning: "게으른", root: "고대 프랑스어 lasche(느슨한) → 긴장감 없이 몸과 마음의 끈이 축 늘어지고 '느슨해져서' 움직이기 싫어하는 상태입니다.", cognates: "lax(느슨한), relax(휴식하다)", group: "3. 부정적 성향 (-neg-, -cru-)" },
            { word: "evil", meaning: "나쁜, 사악한; 악", root: "고대 영어 yfel(한계를 넘은) → 인간이 지켜야 할 정상적인 도덕적 경계선을 '넘어서' 버린 끔찍한 '사악함'을 뜻합니다.", cognates: "over(넘어서 - 어원적 뿌리 공유)", group: "3. 부정적 성향 (-neg-, -cru-)" },
            { word: "foolish", meaning: "바보 같은, 어리석은", root: "follis(바람 빠진 가죽 주머니) → 머릿속에 든 것이 없이 공기 빠진 주머니처럼 '텅 비어있어' 어리석다는 비유적 표현입니다.", cognates: "fool(바보)", group: "3. 부정적 성향 (-neg-, -cru-)" },

            // 그룹 4: 감정과 관계 형용사 (Phrasal & Social)
            { word: "sensitive", meaning: "민감한, 예민한", root: "sens(느끼다) + itive → 외부의 작은 자극이나 남의 기분을 안테나처럼 아주 빠르고 예리하게 '느끼고 반응하는' 특성입니다.", cognates: "sense(감각), sentiment(감정)", group: "4. 감정과 관계 형성 (-sens-, -cur-)" },
            { word: "curious", meaning: "호기심이 많은, 알고 싶어 하는", root: "cur(주의, 돌봄) + ious → 주변의 어떤 대상에게 강한 '주의'를 기울이고 마음을 써서 알아내고자 하는 성향입니다.", cognates: "care(주의), cure(치료하다)", group: "4. 감정과 관계 형성 (-sens-, -cur-)" },

    let currentLesson = 1; // 기본은 Day 1

    // --- 단원(탭) 변경 로직 ---
    function setLesson(lessonNumber) {
        currentLesson = lessonNumber;
        currentCardIndex = 0; 

        // 탭 UI 업데이트 (그린 톤)
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
            btn.classList.replace('text-green-600', 'text-gray-500');
            btn.classList.replace('border-green-600', 'border-transparent');
            btn.classList.remove('bg-green-50', 'bg-green-100', 'bg-green-50', 'bg-green-100', 'bg-green-100', 'bg-green-100', 'bg-green-100', 'bg-green-100', 'bg-green-100', 'bg-green-100', 'text-green-700', 'border-green-200'); // Clean up any old tailwind
            btn.style.backgroundColor = 'transparent';
            btn.style.color = '#6b7280';
            btn.style.borderBottomColor = 'transparent';
            btn.style.fontWeight = '500';
        });
        
        const activeTab = document.getElementById(`tab-${lessonNumber}`);
        activeTab.style.color = '#16a34a'; // text-green-600
        activeTab.style.borderBottomColor = '#16a34a';
        activeTab.style.fontWeight = '700';
        activeTab.style.backgroundColor = '#dcfce7'; // bg-green-100

        renderList();
    }

    // --- 초기화 및 리스트 렌더링 ---
    function renderList() {
        const listView = document.getElementById('listView');
        let htmlContent = '';
        
        // 현재 Day의 데이터 가져오기
        const words = db[currentLesson];
        currentFlatWordList = words; 

        // 그룹별로 데이터 묶기
        const groupedData = words.reduce((acc, word) => {
            if (!acc[word.group]) acc[word.group] = [];
            acc[word.group].push(word);
            return acc;
        }, {});

        // 🎯 고유 ID를 위한 카운터 (아코디언 버그 완벽 방지)
        let wordIdCounter = 0;

        for (const [groupName, groupWords] of Object.entries(groupedData)) {
            htmlContent += `
                <div class="mb-8">
                    <h2 class="text-sm font-extrabold text-green-700 uppercase tracking-wide mb-3 px-1 border-l-4 border-green-500 pl-2">
                        ${groupName}
                    </h2>
                    <div class="space-y-3">
            `;
            
            groupWords.forEach((item) => {
                const id = `word-${currentLesson}-${wordIdCounter++}`;
                htmlContent += `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow duration-300">
                        <div class="p-4 flex justify-between items-center cursor-pointer active:bg-gray-50" onclick="toggleAccordion('${id}')">
                            <div>
                                <h3 class="text-[1.15rem] font-bold text-gray-800">${item.word}</h3>
                                <p class="text-sm font-medium text-gray-500 mt-0.5">${item.meaning}</p>
                            </div>
                            <div class="w-8 h-8 flex justify-center items-center rounded-full bg-green-50 text-green-500">
                                <i id="icon-${id}" class="fa-solid fa-chevron-down transition-transform duration-300 text-sm"></i>
                            </div>
                        </div>
                        
                        <div id="content-${id}" class="accordion-content bg-gray-50 px-5 border-t border-gray-100">
                            <div class="mb-4 mt-2">
                                <span class="inline-flex items-center bg-green-100 text-green-800 text-xs px-2.5 py-1 rounded-md font-bold mb-2 shadow-sm">
                                    <i class="fa-solid fa-book-open mr-1.5"></i>어원의 비밀
                                </span>
                                <p class="text-[0.9rem] text-gray-700 leading-relaxed font-medium">${item.root}</p>
                            </div>
                            <div class="pb-3">
                                <span class="inline-flex items-center bg-blue-50 text-blue-700 border border-blue-100 text-xs px-2.5 py-1 rounded-md font-bold mb-2">
                                    <i class="fa-solid fa-link mr-1.5"></i>동계어 (Family)
                                </span>
                                <p class="text-sm text-gray-600 font-semibold">${item.cognates}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
            htmlContent += `</div></div>`;
        }
        listView.innerHTML = htmlContent;
        updateFlashcard();
    }

    // --- 아코디언 토글 애니메이션 로직 ---
    function toggleAccordion(id) {
        const content = document.getElementById(`content-${id}`);
        const icon = document.getElementById(`icon-${id}`);
        
        if (content.classList.contains('open')) {
            content.classList.remove('open');
            icon.classList.remove('rotate-180');
        } else {
            // 다른 열린 아코디언 닫기 (옵션)
            document.querySelectorAll('.accordion-content.open').forEach(el => {
                if(el.id !== `content-${id}`) {
                    el.classList.remove('open');
                    const otherIcon = document.getElementById(el.id.replace('content-', 'icon-'));
                    if(otherIcon) otherIcon.classList.remove('rotate-180');
                }
            });

            content.classList.add('open');
            icon.classList.add('rotate-180');
        }
    }

    // --- 플래시카드 토글 모드 ---
    function toggleMode() {
        const flashcardView = document.getElementById('flashcardView');
        const modeBtn = document.getElementById('modeToggleBtn');
        
        if (flashcardView.classList.contains('hidden')) {
            flashcardView.classList.remove('hidden');
            flashcardView.classList.add('flex');
            modeBtn.innerHTML = '<i class="fa-solid fa-list mr-1"></i> 목록보기';
            updateFlashcard();
        } else {
            flashcardView.classList.add('hidden');
            flashcardView.classList.remove('flex');
            modeBtn.innerHTML = '<i class="fa-solid fa-layer-group mr-1"></i> 카드모드';
        }
    }

    // --- 플래시카드 업데이트 ---

        const item = currentFlatWordList[currentCardIndex];
        document.getElementById('cardGroup').innerText = item.group;
        document.getElementById('cardWord').innerText = item.word;
        document.getElementById('cardWordBack').innerText = item.word;
        document.getElementById('cardMeaning').innerText = item.meaning;
        document.getElementById('cardRoot').innerText = item.root;
        document.getElementById('cardCognates').innerText = item.cognates;
        
        document.getElementById('flashcardCounter').innerText = `${currentCardIndex + 1} / ${currentFlatWordList.length}`;
        
        // 카드 넘길 때 항상 앞면으로 리셋
        if(isFlipped) {
            document.getElementById('flashcard').classList.remove('rotate-y-180');
            isFlipped = false;
        }
    }

    // --- 카드 뒤집기 ---
    function flipCard() {
        const card = document.getElementById('flashcard');
        isFlipped = !isFlipped;
        if (isFlipped) {
            card.classList.add('rotate-y-180');
        } else {
            card.classList.remove('rotate-y-180');
        }
    }

    function prevCard() {
        if (currentCardIndex > 0) {
            currentCardIndex--;
        } else {
            currentCardIndex = currentFlatWordList.length - 1; // 처음이면 마지막으로 루프
        }
        updateFlashcard();
    }

    function nextCard() {
        if (currentCardIndex < currentFlatWordList.length - 1) {
            currentCardIndex++;
        } else {
            currentCardIndex = 0; // 마지막이면 처음으로 루프
        }
        updateFlashcard();
    }

    // 초기 실행
    window.onload = () => {
        setLesson(1); // 앱 켜면 Day 1 기본 선택
    };
</script>
</body>
</html>
