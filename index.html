<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>종합 영단어 포털 (SPA)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 기본 폰트 및 앱 스타일 */
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; overflow: hidden; }
        
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

        /* 아코디언 애니메이션 */
        .accordion-content { transition: max-height 0.3s ease-in-out, padding 0.3s ease-in-out, opacity 0.3s ease-in-out; max-height: 0; opacity: 0; overflow: hidden; }
        .accordion-content.open { max-height: 400px; opacity: 1; padding-top: 1rem; padding-bottom: 1rem; }
        
        /* 플래시카드 3D 애니메이션 */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flip-card-inner { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }

        /* 모바일 사이드바 트랜지션 */
        #sidebar { transition: transform 0.3s ease-in-out; }
        @media (max-width: 768px) {
            #sidebar { transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
        }

        /* 활성화된 사이드바 메뉴 스타일 */
        .menu-item.active { background-color: #eff6ff; color: #3b82f6; border-right: 4px solid #3b82f6; font-weight: 700; }
    </style>
</head>
<body class="flex h-screen w-full relative">

    <!-- 모바일 환경을 위한 사이드바 오버레이 배경 -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900 bg-opacity-50 z-40 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- 왼쪽 사이드바 (내비게이션) -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-64 bg-white border-r border-slate-200 z-50 flex flex-col h-full shadow-2xl md:shadow-none flex-shrink-0">
        <!-- 사이드바 헤더 -->
        <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
            <h1 class="text-lg font-black text-slate-800 tracking-tight"><i class="fa-solid fa-graduation-cap text-blue-600 mr-2"></i>통합 단어장</h1>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-500 hover:text-slate-800"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        
        <!-- 사이드바 메뉴 리스트 (JS로 동적 렌더링) -->
        <div class="flex-1 overflow-y-auto py-4" id="menuContainer">
            <!-- Menu items will be generated here -->
        </div>
    </aside>

    <!-- 오른쪽 메인 콘텐츠 영역 -->
    <main class="flex-1 flex flex-col h-full relative min-w-0">
        
        <!-- 상단 앱 헤더 -->
        <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md z-20">
            <div class="flex items-center">
                <!-- 햄버거 메뉴 버튼 (모바일에서만 보임) -->
                <button onclick="toggleSidebar()" class="md:hidden mr-4 text-white hover:text-blue-200 transition">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <div>
                    <!-- 현재 선택된 교재와 단원 이름 -->
                    <h2 id="currentLessonTitle" class="text-lg font-bold">학습할 단원을 선택하세요</h2>
                    <p id="currentBookTitle" class="text-xs text-blue-200 mt-0.5">왼쪽 메뉴를 열어주세요</p>
                </div>
            </div>
            <!-- 카드 모드 전환 버튼 (기본은 숨김 처리) -->
            <button onclick="toggleFlashcardMode()" id="modeToggleBtn" class="bg-blue-800 bg-opacity-50 text-white px-3 py-1.5 rounded-full text-sm font-semibold shadow-sm hover:bg-blue-700 transition hidden">
                <i class="fa-solid fa-clone mr-1"></i> 카드모드
            </button>
        </header>

        <!-- 리스트 뷰 영역 (메인 화면) -->
        <div id="listView" class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-50 space-y-4 pb-24">
            <!-- 초기 안내 화면 -->
            <div class="flex flex-col items-center justify-center h-full text-slate-400">
                <i class="fa-solid fa-book-open text-6xl mb-4 text-slate-200"></i>
                <p class="font-medium text-lg">왼쪽 메뉴에서 학습할 단원을 선택해주세요.</p>
            </div>
        </div>

        <!-- 플래시카드 뷰 영역 (기본 숨김) -->
        <div id="flashcardView" class="hidden absolute inset-0 bg-slate-900 bg-opacity-95 z-30 flex-col pb-10 pt-16">
            <!-- 플래시카드 상단 헤더 -->
            <div class="flex justify-between items-center px-6 pb-4 text-white">
                <span id="flashcardCounter" class="text-sm font-bold bg-slate-800 px-4 py-1.5 rounded-full border border-slate-600 text-blue-300 shadow-inner">0 / 0</span>
                <button onclick="toggleFlashcardMode()" class="text-slate-400 hover:text-white transition transform hover:rotate-90"><i class="fa-solid fa-xmark text-3xl"></i></button>
            </div>

            <!-- 카드 본체 -->
            <div class="flex-1 flex items-center justify-center p-6 w-full perspective-1000">
                <div id="flashcard" class="w-full h-[65vh] max-w-sm relative transform-style-3d flip-card-inner cursor-pointer" onclick="flipCard()">
                    
                    <!-- 앞면 (단어) -->
                    <div class="absolute inset-0 w-full h-full bg-white rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] backface-hidden flex flex-col justify-center items-center p-8 text-center border-b-8 border-blue-500">
                        <span id="cardGroup" class="absolute top-6 text-xs font-bold text-blue-600 bg-blue-100 px-3 py-1 rounded-full">그룹</span>
                        <h2 id="cardWord" class="text-4xl font-black text-slate-800 mb-4 tracking-tight break-words">Word</h2>
                        <p class="text-slate-400 text-sm mt-8 font-semibold animate-pulse"><i class="fa-solid fa-hand-pointer mr-2"></i>탭하여 뜻 확인</p>
                    </div>

                    <!-- 뒷면 (뜻, 어원) -->
                    <div class="absolute inset-0 w-full h-full bg-slate-800 rounded-3xl shadow-2xl backface-hidden rotate-y-180 flex flex-col p-6 text-white overflow-y-auto border border-slate-700">
                        <h2 id="cardWordBack" class="text-2xl font-bold mb-3 border-b border-slate-600 pb-2 text-blue-300">Word</h2>
                        <p id="cardMeaning" class="text-xl font-black mb-6 text-white">의미</p>
                        
                        <div class="bg-slate-900 bg-opacity-80 rounded-xl p-4 shadow-inner">
                            <p class="text-xs text-emerald-400 mb-2 font-bold uppercase tracking-wider"><i class="fa-solid fa-lightbulb mr-1"></i> 메타인지 어원</p>
                            <p id="cardRoot" class="text-sm leading-relaxed text-slate-300 font-medium break-keep">어원 설명</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 네비게이션 버튼 (이전/다음) -->
            <div class="flex justify-center items-center space-x-8 px-6 pb-4">
                <button onclick="prevCard()" class="w-16 h-16 rounded-full bg-slate-700 text-white flex justify-center items-center active:bg-slate-600 hover:bg-slate-600 transition border border-slate-600 shadow-lg">
                    <i class="fa-solid fa-chevron-left text-2xl"></i>
                </button>
                <button onclick="nextCard()" class="w-16 h-16 rounded-full bg-blue-600 text-white flex justify-center items-center active:bg-blue-500 hover:bg-blue-500 transition shadow-[0_0_20px_rgba(37,99,235,0.4)] font-bold">
                    <i class="fa-solid fa-chevron-right text-2xl"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        // -------------------------------------------------------------
        // 통합 데이터베이스 (SPA 구조의 핵심)
        // 교재명 -> 단원명 -> 단어 배열 형태로 데이터를 저장합니다.
        // -------------------------------------------------------------
        const database = {
            "워마 중등실력": {
                "Day 6 (음식/식재료)": [
                    { word: "butter", meaning: "버터", root: "bou(소) + tyros(치즈) → 소젖으로 만든 지방", group: "기본 식재료" },
                    { word: "pepper", meaning: "후추; 고추", root: "산스크리트어 pippali(산초)에서 유래. 과거엔 황금보다 비쌌음", group: "조미료/향신료" },
                    { word: "salt", meaning: "소금", root: "라틴어 sal(소금). 로마 병사 월급(salary)의 어원", group: "조미료/향신료" },

                    { word: "beef", meaning: "소고기", root: "bovem(소). 프랑스어 boeuf에서 영어로 유입", group: "육류/해산물" },

                "Day 8 (집/가구/생활)": [

                    { word: "direction", meaning: "방향", root: "di(분리) + rect(똑바른) → 똑바로 가리키는 쪽", group: "길찾기/안내" },
                    { word: "turn", meaning: "회전하다", root: "라틴어 tornare(둥글게 돌리다)", group: "길찾기/안내" },
                    { word: "straight", meaning: "똑바로, 직선으로", root: "stretch(팽팽히 당기다) → 구부러지지 않은 상태", group: "길찾기/안내" },
                    { word: "left", meaning: "왼쪽", root: "오른손잡이가 많아 왼손을 '약한 손(lyft)'이라 불렀음", group: "길찾기/안내" },
                    { word: "in the middle of", meaning: "~의 중간에", root: "가운데(middle)에 위치한", group: "길찾기/안내" },
                    { word: "block", meaning: "블록, 구획; 막다", root: "커다란 나무 덩어리 → 도로로 잘라 나눈 네모난 구역", group: "길찾기/안내" },
                    { word: "be known for", meaning: "~로 유명하다", root: "특징 때문에 사람들에게 알려지다(known)", group: "장소 표현" },
                    { word: "give ~ a ride", meaning: "~를 태워 주다", root: "자동차나 말 타는 것(ride)을 제공하다(give)", group: "장소 표현" },
                    { word: "patrol", meaning: "순찰대, 순찰 경관", root: "patouiller(진흙탕을 걷다) → 밤낮으로 동네를 돌아다니며 지키다", group: "장소 표현" }
                ]
            }
        };

        // 전역 상태 변수들 (화면 제어 및 플래시카드 로직용)
        let currentFlatList = [];     // 현재 선택된 단원의 단어 리스트
        let currentCardIndex = 0;     // 현재 보고 있는 카드의 번호
        let isFlipped = false;        // 카드가 뒤집혀 있는지 여부
        let globalWordIndex = 0;      // 아코디언 버그 방지를 위한 고유 ID 카운터

        // 사이드바 메뉴 동적 렌더링 함수
        function renderMenu() {
            const menuContainer = document.getElementById('menuContainer');
            let menuHTML = '';

            // database 객체를 순회하며 HTML 메뉴 만들기
            for (const book in database) {
                menuHTML += `
                    <div class="mb-6">
                        <h3 class="text-[11px] font-black text-slate-400 mb-2 px-5 uppercase tracking-widest">${book}</h3>
                        <ul class="space-y-0.5">
                `;
                
                for (const lesson in database[book]) {
                    // 특수문자나 띄어쓰기를 없애 안전한 HTML ID 생성
                    const safeId = `menu-${book.replace(/\s+/g, '')}-${lesson.replace(/[^a-zA-Z0-9]/g, '')}`;
                    menuHTML += `
                        <li>
                            <button id="${safeId}" onclick="loadLesson('${book}', '${lesson}', '${safeId}')" 
                                class="menu-item w-full text-left px-5 py-2.5 text-sm text-slate-600 font-medium hover:bg-slate-100 transition flex items-center group">
                                <i class="fa-solid fa-chevron-right text-[9px] mr-3 opacity-30 group-hover:opacity-70 group-hover:translate-x-1 transition-all"></i>
                                ${lesson}
                            </button>
                        </li>
                    `;
                }
                menuHTML += `</ul></div>`;
            }
            menuContainer.innerHTML = menuHTML;
        }

        // 특정 단원을 클릭했을 때 화면 데이터를 갈아끼우는 함수
        function loadLesson(book, lesson, menuId) {
            // 1. 모든 메뉴의 하이라이트(active) 효과 지우기
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            // 2. 방금 클릭한 메뉴만 하이라이트 효과 넣기
            document.getElementById(menuId).classList.add('active');

            // 3. 상단 헤더 텍스트 변경
            document.getElementById('currentLessonTitle').innerText = lesson;
            document.getElementById('currentBookTitle').innerText = book;
            
            // 4. 모드 전환 버튼(카드모드) 노출
            document.getElementById('modeToggleBtn').classList.remove('hidden');

            // 5. 현재 학습할 단어 데이터 배열을 전역 변수에 저장
            currentFlatList = database[book][lesson];
            currentCardIndex = 0; // 카드 인덱스 초기화
            globalWordIndex = 0;  // 아코디언 고유 ID 카운터 초기화

            // 6. 모바일 환경이면 클릭 시 자동으로 사이드바 닫기
            if(window.innerWidth < 768) {
                toggleSidebar();
            }

            // 7. 메인 리스트 뷰 그리기 함수 호출
            renderList();
        }

        // 메인 리스트 뷰(아코디언 형태) 렌더링 함수
        function renderList() {
            const listView = document.getElementById('listView');
            let htmlContent = '';
            
            // 단어를 'group' 속성별로 묶어서 새 객체(groupedData) 생성
            const groupedData = currentFlatList.reduce((acc, word) => {
                if (!acc[word.group]) acc[word.group] = [];
                acc[word.group].push(word);
                return acc;
            }, {});

            // 그룹별로 화면에 그리기
            for (const [groupName, groupWords] of Object.entries(groupedData)) {
                htmlContent += `
                    <div class="mb-6 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-blue-50 border-b border-blue-100 py-2.5 px-4 flex items-center">
                            <div class="w-2 h-2 rounded-full bg-blue-500 mr-2"></div>
                            <h2 class="text-sm font-bold text-blue-800">${groupName}</h2>
                        </div>
                        <div class="divide-y divide-slate-100">
                `;
                
                groupWords.forEach((item) => {
                    // 완벽하게 고유한 ID 할당 (클릭 오류 방지)
                    const id = `word-item-${globalWordIndex++}`;
                    htmlContent += `
                        <div>
                            <!-- 단어 표제어 부분 (클릭 시 펼쳐짐) -->
                            <div class="p-4 flex justify-between items-center cursor-pointer hover:bg-slate-50 transition" onclick="toggleAccordion('${id}')">
                                <div class="pr-4">
                                    <h3 class="text-lg font-extrabold text-slate-800">${item.word}</h3>
                                    <p class="text-[0.9rem] font-medium text-slate-500 mt-0.5">${item.meaning}</p>
                                </div>
                                <div class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-400 flex-shrink-0">
                                    <i id="icon-${id}" class="fa-solid fa-chevron-down transition-transform duration-300 text-sm"></i>
                                </div>
                            </div>
                            
                            <!-- 숨겨진 상세 설명 부분 (아코디언) -->
                            <div id="content-${id}" class="accordion-content bg-slate-50 px-5 border-t border-slate-100">
                                <div class="mb-1">
                                    <span class="inline-block bg-emerald-100 text-emerald-800 text-[10px] px-2 py-1 rounded-md font-bold mb-1.5 uppercase tracking-wide"><i class="fa-solid fa-lightbulb mr-1"></i> 메타인지 어원</span>
                                    <p class="text-sm text-slate-700 leading-relaxed font-medium break-keep">${item.root}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });
                htmlContent += `</div></div>`;
            }
            listView.innerHTML = htmlContent;
            
            // 리스트가 업데이트될 때 플래시카드 데이터도 준비해 둠
            updateFlashcard();
        }

        // 아코디언(숨김 내용 펼치기) 토글 함수
        function toggleAccordion(id) {
            const content = document.getElementById(`content-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.classList.remove('rotate-180');
            } else {
                content.classList.add('open');
                icon.classList.add('rotate-180');
            }
        }

        // 모바일 사이드바 열기/닫기 토글 함수
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                overlay.classList.add('hidden');
            } else {
                sidebar.classList.add('open');
                overlay.classList.remove('hidden');
            }
        }

        // 리스트 모드 <-> 플래시카드 모드 전환 함수
        function toggleFlashcardMode() {
            if(currentFlatList.length === 0) return; // 선택된 단원이 없으면 작동 안 함
            
            const flashcardView = document.getElementById('flashcardView');
            const modeBtn = document.getElementById('modeToggleBtn');
            const listView = document.getElementById('listView');
            
            if (flashcardView.classList.contains('hidden')) {
                // 카드 모드 열기
                flashcardView.classList.remove('hidden');
                flashcardView.classList.add('flex');
                listView.classList.add('hidden'); // 뒷배경 스크롤 방지용으로 리스트 숨김
                modeBtn.innerHTML = '<i class="fa-solid fa-list mr-1"></i> 목록보기';
                updateFlashcard();
            } else {
                // 리스트 모드로 돌아가기
                flashcardView.classList.add('hidden');
                flashcardView.classList.remove('flex');
                listView.classList.remove('hidden');
                modeBtn.innerHTML = '<i class="fa-solid fa-clone mr-1"></i> 카드모드';
            }
        }

        // 플래시카드 안의 텍스트 업데이트 함수
        function updateFlashcard() {
            if(currentFlatList.length === 0) return;
            const item = currentFlatList[currentCardIndex];
            
            document.getElementById('cardGroup').innerText = item.group;
            document.getElementById('cardWord').innerText = item.word;
            document.getElementById('cardWordBack').innerText = item.word;
            document.getElementById('cardMeaning').innerText = item.meaning;
            document.getElementById('cardRoot').innerText = item.root;
            
            document.getElementById('flashcardCounter').innerText = `${currentCardIndex + 1} / ${currentFlatList.length}`;
            
            // 다른 카드로 넘어갈 땐 무조건 앞면(단어)이 보이도록 덮어둠
            if(isFlipped) {
                document.getElementById('flashcard').classList.remove('rotate-y-180');
                isFlipped = false;
            }
        }

        // 3D 카드 뒤집기 애니메이션 트리거
        function flipCard() {
            const card = document.getElementById('flashcard');
            isFlipped = !isFlipped;
            card.classList.toggle('rotate-y-180');
        }

        // 이전 카드로 이동
        function prevCard() {
            currentCardIndex = (currentCardIndex > 0) ? currentCardIndex - 1 : currentFlatList.length - 1;
            updateFlashcard();
        }

        // 다음 카드로 이동
        function nextCard() {
            currentCardIndex = (currentCardIndex < currentFlatList.length - 1) ? currentCardIndex + 1 : 0;
            updateFlashcard();
        }

        // 웹 브라우저가 켜질 때 최초 실행되는 함수
        window.onload = () => {
            renderMenu(); // 사이드바 메뉴 생성
            
            // (옵션) 시작할 때 첫 번째 교재의 첫 번째 단원을 자동으로 열어주고 싶다면 아래 코드 활성화
            // loadLesson("워마 중등실력", "Day 6 (음식/식재료)", "menu-워마중등실력-Day6음식식재료");
        };
    </script>
</body>
</html>
