            background-color: #f9fafb;
            -webkit-tap-highlight-color: transparent;

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */

        }
        .tab-btn:active {
            transform: scale(0.95);
        }
        .option-btn {
            transition: all 0.2s ease;
        }
        .option-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        const VOCAB_LIST = RAW_DATA.trim().split('\n').map((line, idx) => {
            const [day, word, meaning, etymology, cognates, group] = line.split('|');
            return { id: idx, day, word, meaning, etymology, cognates, group };
        });

        const ALL_DAYS = [...new Set(VOCAB_LIST.map(v => v.day))].sort((a, b) => Number(a) - Number(b));

        let state = {
            tab: 'study',
            studyDay: ALL_DAYS[0],
            test: {
                status: 'config', // config, active, finished
                day: 'ALL',
                amount: 10,
                type: 'wordToMeaning', // 'wordToMeaning' or 'meaningToWord'
                questions: [],
                currentQIndex: 0,
                score: 0,
                mistakes: [],
                selectedAnswer: null
            }
        };

        const mainContent = document.getElementById('main-content');

        function render() {
            if (state.tab === 'study') {
                renderStudyView();
            } else {
                renderTestView();
            }
            updateNavigation();
        }

        function updateNavigation() {
            const tabStudy = document.getElementById('tab-study');
            const tabTest = document.getElementById('tab-test');
            
            if (state.tab === 'study') {
                tabStudy.className = "tab-btn flex-1 py-4 flex flex-col items-center justify-center space-y-1 text-indigo-600";
                tabTest.className = "tab-btn flex-1 py-4 flex flex-col items-center justify-center space-y-1 text-gray-400 hover:text-gray-600";
            } else {
                tabStudy.className = "tab-btn flex-1 py-4 flex flex-col items-center justify-center space-y-1 text-gray-400 hover:text-gray-600";
                tabTest.className = "tab-btn flex-1 py-4 flex flex-col items-center justify-center space-y-1 text-indigo-600";
            }
        }

        function switchTab(tabName) {
            state.tab = tabName;
            render();
        }

        function renderStudyView() {
            const filteredWords = VOCAB_LIST.filter(v => v.day === state.studyDay);
            const dayGroups = [...new Set(filteredWords.map(v => v.group))].sort();

            let optionsHtml = ALL_DAYS.map(day => 
                `<option value="${day}" ${state.studyDay === day ? 'selected' : ''}>Day ${day} 학습하기</option>`
            ).join('');

            let groupsHtml = dayGroups.map(group => {
                const wordsInGroup = filteredWords.filter(v => v.group === group);
                const wordsHtml = wordsInGroup.map(item => `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xl font-black text-gray-900">${item.word}</span>
                            <span class="text-sm font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded text-right leading-tight max-w-[50%]">${item.meaning}</span>
                        </div>
                        <div class="text-xs text-gray-600 bg-gray-50 p-3 rounded-xl mt-3 space-y-1">
                            <p><span class="font-semibold text-gray-800">🌱 어원:</span> ${item.etymology}</p>
                            <p><span class="font-semibold text-gray-800">🔗 동계어:</span> ${item.cognates}</p>
                        </div>
                    </div>
                `).join('');

                return `
                    <div class="space-y-3">
                        <h3 class="font-bold text-indigo-700 border-b border-indigo-200 pb-2 ml-1 mt-4">${group}</h3>
                        <div class="grid grid-cols-1 gap-3">

            }).join('');

            mainContent.innerHTML = `
                <div class="pb-24">
                    <div class="p-4 space-y-2 sticky top-0 bg-gray-50/95 backdrop-blur-md z-10 border-b border-gray-200">
                        <div class="flex justify-between items-center mb-1">
                            <h2 class="text-xl font-bold text-gray-800">어원별 단어장</h2>

                        >
                            ${optionsHtml}
                        </select>
                    </div>
                    <div class="p-4 space-y-6">
                        ${groupsHtml}

        }

        window.changeStudyDay = function(day) {
            state.studyDay = day;
            render();
        }

        function renderTestView() {
            if (state.test.status === 'config') {
                renderTestConfig();
            } else if (state.test.status === 'active') {
                renderActiveTest();
            } else if (state.test.status === 'finished') {
                renderTestResults();
            }
        }

            let dayOptions = `<option value="ALL" ${state.test.day === 'ALL' ? 'selected' : ''}>전체 범위 (All Days)</option>`;
            dayOptions += ALL_DAYS.map(day => 
                `<option value="${day}" ${state.test.day === day ? 'selected' : ''}>Day ${day}</option>`
            ).join('');

            mainContent.innerHTML = `

                        </button>
                    </div>
                </div>
            `;
        }

        window.updateTestConfig = function(key, value) {
            state.test[key] = (key === 'amount' && value !== 'ALL') ? Number(value) : value;
            if (key === 'type') renderTestConfig(); 
        }

        window.startTest = function() {
            let pool = state.test.day === 'ALL' ? VOCAB_LIST : VOCAB_LIST.filter(v => v.day === state.test.day);
            
            // Randomly select N words
            const shuffled = [...pool].sort(() => 0.5 - Math.random());
            const amount = state.test.amount === 'ALL' ? shuffled.length : Math.min(state.test.amount, shuffled.length);
            const selected = shuffled.slice(0, amount);
            
            // Generate options
            state.test.questions = selected.map(qWord => {
                const options = new Set([qWord]);
                while (options.size < 4 && options.size < VOCAB_LIST.length) {
                    const randomItem = VOCAB_LIST[Math.floor(Math.random() * VOCAB_LIST.length)];
                    if (!Array.from(options).some(opt => opt.id === randomItem.id)) {
                        options.add(randomItem);
                    }
                }
                return {
                    correct: qWord,
                    options: Array.from(options).sort(() => 0.5 - Math.random())
                };
            });

            state.test.currentQIndex = 0;
            state.test.score = 0;
            state.test.mistakes = [];
            state.test.selectedAnswer = null;
            state.test.status = 'active';
            render();
        }

        function renderActiveTest() {
            const q = state.test.questions[state.test.currentQIndex];
            const isW2M = state.test.type === 'wordToMeaning';
            const progress = (state.test.currentQIndex / state.test.questions.length) * 100;

            let optionsHtml = q.options.map((opt, i) => {
                let btnClass = "option-btn w-full p-4 text-left rounded-2xl font-medium border-2 transition-all ";
                
                if (state.test.selectedAnswer) {
                    if (opt.id === q.correct.id) {
                        btnClass += "bg-green-50 border-green-500 text-green-700"; 
                    } else if (state.test.selectedAnswer === opt.id) {
                        btnClass += "bg-red-50 border-red-500 text-red-700"; 
                    } else {
                        btnClass += "bg-white border-gray-100 text-gray-400 opacity-50"; 
                    }
                } else {
                    btnClass += "bg-white border-gray-200 text-gray-700 hover:border-indigo-300 active:bg-indigo-50";
                }

                const displayStr = isW2M ? opt.meaning : opt.word;
                return `<button onclick="handleAnswer(${opt.id})" ${state.test.selectedAnswer ? 'disabled' : ''} class="${btnClass}">${displayStr}</button>`;
            }).join('');

            mainContent.innerHTML = `
                <div class="flex flex-col items-center min-h-full p-4 pb-24">
                    <div class="w-full max-w-md flex justify-between items-center mb-6 px-2 mt-2">
                        <div class="text-sm font-bold text-gray-400">Question ${state.test.currentQIndex + 1} / ${state.test.questions.length}</div>
                        <div class="text-sm font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">Score: ${state.test.score}</div>
                    </div>

                    <div class="w-full flex bg-gray-200 h-2 rounded-full mb-8 overflow-hidden">
                        <div class="bg-indigo-500 h-full transition-all duration-300" style="width: ${progress}%"></div>
                    </div>

                    <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-sm border border-gray-100 text-center mb-8 flex flex-col justify-center min-h-[200px]">
                        <div class="flex justify-center items-center space-x-2 mb-4">
                            <span class="text-xs font-bold text-indigo-500 bg-indigo-50 px-2 py-1 rounded">Day ${q.correct.day}</span>
                            <span class="text-xs font-medium text-gray-400">${q.correct.group}</span>
                        </div>
                        <h2 class="text-4xl font-black text-gray-800 leading-tight break-words">
                            ${isW2M ? q.correct.word : q.correct.meaning}
                        </h2>
                    </div>

                    <div class="w-full max-w-md space-y-3">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        }

        window.handleAnswer = function(optionId) {
            if (state.test.selectedAnswer !== null) return;

            const q = state.test.questions[state.test.currentQIndex];
            const isCorrect = optionId === q.correct.id;
            
            state.test.selectedAnswer = optionId;

            if (isCorrect) {
                state.test.score++;
            } else {
                state.test.mistakes.push(q.correct);
            }

            render(); // re-render to show colors

            setTimeout(() => {
                if (state.test.currentQIndex + 1 < state.test.questions.length) {
                    state.test.currentQIndex++;
                    state.test.selectedAnswer = null;
                } else {
                    state.test.status = 'finished';
                }
                render();
            }, 1000);
        }

        function renderTestResults() {
            const total = state.test.questions.length;
            const score = state.test.score;
            
            let message = "틀린 단어는 아래에서 다시 복습해보세요.";
            if (score === total) message = "완벽합니다! 모든 단어를 마스터했어요! 🎉";

            let mistakesHtml = '';
            if (state.test.mistakes.length > 0) {
                mistakesHtml = `
                    <div class="w-full max-w-sm space-y-3 mt-6">
                        <h3 class="font-bold text-red-500 mb-2 px-2">오답 노트 (${state.test.mistakes.length})</h3>
                        ${state.test.mistakes.map(m => `
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-red-100 text-left">
                                <div class="flex justify-between items-center mb-1">
                                    <div class="font-bold text-lg text-gray-800">${m.word}</div>
                                    <span class="text-xs font-bold text-indigo-500 bg-indigo-50 px-2 py-1 rounded">Day ${m.day}</span>
                                </div>
                                <div class="text-blue-600 text-sm font-medium mb-2">${m.meaning}</div>
                                <div class="text-xs text-gray-500 bg-gray-50 p-2 rounded-lg">
                                    <span class="font-semibold text-gray-700">어원:</span> ${m.etymology}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            mainContent.innerHTML = `
                <div class="flex flex-col items-center p-6 pb-24 text-center">
                    <div class="bg-white w-full max-w-sm p-8 rounded-3xl shadow-sm border border-gray-100 mt-4">
                        <h2 class="text-3xl font-black text-indigo-700 mb-2">결과 확인</h2>
                        <div class="text-6xl font-bold text-gray-800 my-6">
                            ${score} <span class="text-2xl text-gray-400">/ ${total}</span>
                        </div>
                        <p class="text-gray-600">${message}</p>
                    </div>

                    ${mistakesHtml}

                    <button onclick="resetTest()" class="w-full max-w-sm mt-8 py-4 bg-gray-800 hover:bg-gray-900 text-white font-bold rounded-xl transition shadow-md active:scale-95">
                        테스트 다시 설정하기
                    </button>
                </div>
            `;
        }

        window.resetTest = function() {
            state.test.status = 'config';
            render();
        }

        // Initialize App
        render();

    </script>
</body>
</html>
