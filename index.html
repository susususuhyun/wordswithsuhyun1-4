<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>워마 중등실력 4 & 5 (직업/진로)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; overflow-x: hidden; color: #f8fafc; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* 부드러운 아코디언 애니메이션 */
        .accordion-content { transition: max-height 0.35s ease-in-out, padding 0.35s ease-in-out, opacity 0.35s ease-in-out; max-height: 0; opacity: 0; overflow: hidden; }
        .accordion-content.open { max-height: 400px; opacity: 1; padding-top: 1rem; padding-bottom: 1rem; }
        
        /* 3D 플래시카드 애니메이션 설정 */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flip-card-inner { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }

        /* 모바일 앱 뷰포트 고정 */
        .app-container { max-width: 480px; margin: 0 auto; background-color: #1e293b; min-height: 100vh; position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div class="app-container flex flex-col h-screen overflow-hidden">
    
    <header class="bg-slate-900 text-amber-400 p-5 sticky top-0 z-20 flex justify-between items-center shadow-lg border-b border-slate-700">
        <div>
            <h1 class="text-xl font-extrabold tracking-tight"><i class="fa-solid fa-user-tie mr-2"></i>메타인지 단어장</h1>
            <p class="text-xs text-slate-300 mt-1">중등실력 Day 4 & 5 - <span class="text-white font-bold">직업의 기원</span></p>
        </div>
        <button onclick="toggleMode()" id="modeToggleBtn" class="bg-amber-500 text-slate-900 px-4 py-2 rounded-full text-sm font-bold shadow-md hover:bg-amber-400 transition">
            <i class="fa-solid fa-clone mr-1"></i> 카드모드
        </button>
    </header>

    <main id="listView" class="flex-1 overflow-y-auto p-4 space-y-5 pb-24 bg-slate-800">
        <!-- JavaScript로 리스트 콘텐츠 삽입 -->
    </main>

    <div id="flashcardView" class="hidden absolute inset-0 bg-slate-900/95 z-30 flex-col pb-10 backdrop-blur-sm">
        
        <div class="flex justify-between items-center p-5 text-white">
            <span id="flashcardCounter" class="text-sm font-bold bg-slate-800 px-4 py-1.5 rounded-full border border-slate-700 text-amber-400 shadow-inner">1 / 30</span>
            <button onclick="toggleMode()" class="text-slate-400 hover:text-amber-400 transition transform hover:rotate-90"><i class="fa-solid fa-xmark text-3xl"></i></button>
        </div>

        <div class="flex-1 flex items-center justify-center p-6 w-full perspective-1000">
            <div id="flashcard" class="w-full h-[65vh] max-w-sm relative transform-style-3d flip-card-inner cursor-pointer" onclick="flipCard()">
                
                <!-- 앞면 (영어 단어) -->
                <div class="absolute inset-0 w-full h-full bg-slate-800 rounded-3xl shadow-[0_15px_40px_rgba(0,0,0,0.6)] backface-hidden flex flex-col justify-center items-center p-8 text-center border border-slate-600">
                    <span id="cardGroup" class="absolute top-6 text-[0.7rem] font-bold text-slate-900 bg-amber-500 px-3 py-1 rounded-md tracking-wider">그룹</span>
                    <h2 id="cardWord" class="text-4xl font-black text-white mb-4 tracking-tight break-words">Word</h2>
                    <p class="text-slate-400 text-sm mt-8 font-semibold animate-pulse"><i class="fa-solid fa-rotate mr-2"></i>카드를 뒤집어 해설 확인</p>
                </div>

                <!-- 뒷면 (뜻, 어원, 동계어) -->
                <div class="absolute inset-0 w-full h-full bg-slate-700 rounded-3xl shadow-[0_15px_40px_rgba(245,158,11,0.2)] backface-hidden rotate-y-180 flex flex-col p-6 text-slate-200 overflow-y-auto border border-amber-600">
                    <h2 id="cardWordBack" class="text-2xl font-bold mb-2 border-b border-slate-600 pb-2 text-amber-400">Word</h2>
                    <p id="cardMeaning" class="text-xl font-black mb-5 text-white">의미</p>
                    
                    <div class="bg-slate-900/50 rounded-xl p-4 mb-4 shadow-inner border border-slate-600/50">
                        <p class="text-[0.75rem] text-amber-500 mb-2 font-bold uppercase tracking-wider"><i class="fa-solid fa-lightbulb mr-1"></i> 메타인지 어원 스토리</p>
                        <p id="cardRoot" class="text-[0.9rem] leading-relaxed text-slate-300 font-medium break-keep">어원 설명</p>
                    </div>
                    
                    <div class="bg-slate-900/50 rounded-xl p-4 shadow-inner border border-slate-600/50">
                        <p class="text-[0.75rem] text-slate-400 mb-2 font-bold uppercase tracking-wider"><i class="fa-solid fa-link mr-1"></i> 패밀리 단어 (Cognates)</p>
                        <p id="cardCognates" class="text-sm font-medium text-slate-400">동계어 설명</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 하단 네비게이션 버튼 -->
        <div class="flex justify-center items-center space-x-8 px-6 pb-4">
            <button onclick="prevCard()" class="w-16 h-16 rounded-full bg-slate-800 text-slate-300 flex justify-center items-center active:bg-slate-700 hover:bg-slate-700 transition shadow-lg border border-slate-600 hover:text-amber-400">
                <i class="fa-solid fa-chevron-left text-2xl"></i>
            </button>
            <button onclick="nextCard()" class="w-16 h-16 rounded-full bg-amber-500 text-slate-900 flex justify-center items-center active:bg-amber-600 hover:bg-amber-400 transition shadow-[0_0_20px_rgba(245,158,11,0.3)] font-bold">
                <i class="fa-solid fa-chevron-right text-2xl"></i>
            </button>
        </div>
    </div>
</div>

<script>
    const wordData = [
        // 그룹 1: 법, 정치, 공공 서비스 (Politics, Law & Public Service)
        { word: "president", meaning: "대통령", root: "pre(앞에) + sidere(앉다) + ent → 무리의 맨 앞자리에 앉아 회의나 국가를 주재하고 이끄는 최고 책임자입니다.", cognates: "preside(주재하다), resident(거주자)", group: "1. 법, 정치, 공공 서비스" },
        { word: "lawyer", meaning: "변호사", root: "law(법) + yer(사람) → 고대 노르드어 lag(바탕에 놓여진 것)에서 유래하여, 사회의 바탕에 깔린 법을 다루는 전문가입니다.", cognates: "law(법), lawful(합법적인)", group: "1. 법, 정치, 공공 서비스" },
        { word: "judge", meaning: "판사, 심사원; 판단하다", root: "jus(법, 올바름) + dicere(말하다) → 법정에서 무엇이 법이고 올바른지 최종적으로 '말해주는' 사람입니다.", cognates: "justice(정의), dictate(구술하다)", group: "1. 법, 정치, 공공 서비스" },
        { word: "officer", meaning: "공무원, 관리", root: "opus(일, 임무) + facere(하다) → 사적인 일이 아니라 국가나 공공기관의 공적인 '임무(office)를 수행하는' 사람입니다.", cognates: "office(사무실), official(공식적인)", group: "1. 법, 정치, 공공 서비스" },
        { word: "detective", meaning: "탐정", root: "de(벗기다) + tect(덮다) + ive → 범죄자나 용의자가 숨기려고 '덮어둔' 진실을 파헤쳐 '벗겨내는' 사람입니다.", cognates: "detect(발견하다), protect(보호하다)", group: "1. 법, 정치, 공공 서비스" },
        { word: "soldier", meaning: "군인", root: "solidus(로마 금화) → 로마 시대에 소금이나 땅 대신 '금화'를 직접 월급으로 받고 일하던 직업군인(용병)에서 유래했습니다.", cognates: "solid(단단한 - 금화의 성질)", group: "1. 법, 정치, 공공 서비스" },
        { word: "security guard", meaning: "경호원, 경비원", root: "se(없는) + cura(걱정) / guard(지키다) → 고객이 '걱정이 없도록(secure)' 안전하게 지켜주는 사람입니다.", cognates: "secure(안전한), curious(호기심 있는)", group: "1. 법, 정치, 공공 서비스" },
        
        // 그룹 2: 과학, 기술, 공학 (Science, Tech & Engineering)
        { word: "scientist", meaning: "과학자", root: "scire(알다) + ist(사람) → 자연과 우주가 어떻게 돌아가는지 그 이치와 지식을 '아는' 사람입니다.", cognates: "science(과학), conscience(양심)", group: "2. 과학, 기술, 공학" },
        { word: "astronaut", meaning: "우주비행사", root: "astron(별) + nautes(선원) → 바다가 아니라 우주의 '별' 사이를 항해하는 특별한 선원입니다.", cognates: "astronomy(천문학), navy(해군)", group: "2. 과학, 기술, 공학" },
        { word: "engineer", meaning: "기사, 기술자", root: "ingenium(타고난 재능, 발명) + eer → 고대에는 공성 무기나 거대한 기계를 다루는 '천재적인 재능'을 가진 사람을 뜻했습니다.", cognates: "engine(엔진), genius(천재)", group: "2. 과학, 기술, 공학" },
        { word: "mechanic", meaning: "정비공", root: "mechos(기계, 수단) + ic → 자동차나 기계가 작동하는 원리와 구조를 다룰 줄 아는 기술자입니다.", cognates: "machine(기계), mechanism(기계 장치)", group: "2. 과학, 기술, 공학" },
        { word: "architect", meaning: "건축가", root: "archi(최고의, 우두머리) + tekton(목수) → 건물을 지을 때 일하는 모든 목수와 기술자들을 지휘하는 '수석 목수'입니다.", cognates: "archangel(대천사), technology(기술)", group: "2. 과학, 기술, 공학" },
        { word: "carpenter", meaning: "목수", root: "carpentum(마차) → 원래 로마 시대에 나무를 깎아 이륜마차를 만들던 장인에서 유래하여 나무를 다루는 사람을 뜻하게 되었습니다.", cognates: "carpet(카펫 - 덮는 천)", group: "2. 과학, 기술, 공학" },
        { word: "dentist", meaning: "치과의사", root: "dens(치아) + ist(사람) → 인간의 신체 중 '치아'와 관련된 의학적 지식을 다루는 전문가입니다.", cognates: "dental(치과의), indent(들여쓰기 하다)", group: "2. 과학, 기술, 공학" },

        // 그룹 3: 언어, 기록, 교육 (Language, Record & Education)
        { word: "professor", meaning: "교수", root: "pro(앞에서) + fateri(말하다, 선언하다) → 학생들과 대중들 '앞에서' 자신의 학문과 사상을 공개적으로 '선언하며' 가르치는 사람입니다.", cognates: "profess(공언하다), confess(고백하다)", group: "3. 언어, 기록, 교육" },
        { word: "novelist", meaning: "소설가", root: "novus(새로운) + ist(사람) → 기존의 역사적 사실이 아닌, 작가의 상상력으로 만들어낸 '새로운(novel)' 이야기를 쓰는 사람입니다.", cognates: "novel(소설, 새로운), renovate(개조하다)", group: "3. 언어, 기록, 교육" },
        { word: "announcer", meaning: "방송 진행자, 아나운서", root: "ad(~에게) + nuntiare(전하다) → 마이크를 통해 많은 사람들에게 중요한 소식이나 정보를 '전달해 주는' 사람입니다.", cognates: "announce(발표하다), pronounce(발음하다)", group: "3. 언어, 기록, 교육" },
        { word: "reporter", meaning: "기자, 통신원", root: "re(다시) + portare(나르다) → 사건 현장에서 벌어진 일을 취재하여 신문이나 방송을 통해 대중에게 '다시 실어 나르는' 사람입니다.", cognates: "report(보고하다), transport(수송하다)", group: "3. 언어, 기록, 교육" },
        { word: "secretary", meaning: "비서", root: "secret(비밀) + ary(사람) → 예전에는 왕이나 귀족의 가장 중요한 '비밀 서신'을 담당하여 관리하던 고위직에서 유래했습니다.", cognates: "secret(비밀)", group: "3. 언어, 기록, 교육" },
        { word: "accountant", meaning: "회계사", root: "ad(~에) + computare(계산하다) → 회사나 개인의 장부상에 돈이 들어오고 나가는 것을 정확히 '계산하는' 사람입니다.", cognates: "account(계좌, 설명), computer(컴퓨터)", group: "3. 언어, 기록, 교육" },

        // 그룹 4: 예술, 상업, 일상 (Art, Commerce & Daily Life)
        { word: "photographer", meaning: "사진사, 사진작가", root: "phos(빛) + graph(그리다) + er → 붓과 물감이 아니라 카메라 안으로 들어오는 '빛'을 이용하여 그림을 그리는 예술가입니다.", cognates: "photo(사진), paragraph(단락)", group: "4. 예술, 상업, 일상" },
        { word: "illustrator", meaning: "삽화가", root: "in(안에) + lustrare(빛나게 하다) → 글만 있어서 어두운 책 속에 그림을 그려 넣어 내용이 환하게 이해되도록 '빛을 비추는' 사람입니다.", cognates: "illustrate(설명하다), illusion(환상)", group: "4. 예술, 상업, 일상" },
        { word: "hairdresser", meaning: "미용사", root: "hair(머리카락) + dress(옷 입히다, 다듬다) → 사람의 머리카락을 마치 아름다운 옷을 입히고 배열하듯 보기 좋게 '다듬는' 사람입니다.", cognates: "dress(원피스, 옷을 입히다)", group: "4. 예술, 상업, 일상" },
        { word: "businessman", meaning: "사업가", root: "busy(바쁜) + ness + man → 이윤을 창출하기 위해 회사 일과 거래로 항상 '바쁘게' 움직이는 사람입니다.", cognates: "busy(바쁜), business(사업)", group: "4. 예술, 상업, 일상" },
        { word: "salesperson", meaning: "판매원", root: "sale(판매) + person(사람) → 상점이나 기업에서 고객을 응대하고 물건을 '파는(sell)' 역할을 맡은 사람입니다.", cognates: "sell(팔다), sale(판매)", group: "4. 예술, 상업, 일상" },
        { word: "baker", meaning: "제빵사", root: "bacan(굽다) + er(사람) → 고대 영어에서 유래하여 오븐에서 밀가루 반죽을 '구워내는' 사람을 뜻합니다.", cognates: "bake(굽다), bakery(빵집)", group: "4. 예술, 상업, 일상" },
        { word: "fisherman", meaning: "어부", root: "fish(물고기) + er + man → 강이나 바다에서 그물이나 낚시로 '물고기를 잡는' 것을 생업으로 삼는 사람입니다.", cognates: "fish(물고기), fishery(어업)", group: "4. 예술, 상업, 일상" },
        { word: "gardener", meaning: "정원사", root: "garden(정원) + er → garden은 원래 짐승이 못 들어오게 '울타리를 친 곳'을 뜻했으며, 이 공간에 식물을 가꾸는 사람입니다.", cognates: "guard(지키다, 경호원)", group: "4. 예술, 상업, 일상" },

        // 그룹 5: 진로 필수 구동사 (Career Phrasal Verbs)
        { word: "be good at", meaning: "~에 능숙하다, ~을 잘하다", root: "at(~에, ~지점에) → 전치사 at은 특정 지점을 콕 짚는 느낌입니다. 즉 여러 분야 중 특정 분야를 '콕 짚어' 잘한다는 뜻입니다.", cognates: "at(~에), good(좋은)", group: "5. 진로 필수 구동사" },
        { word: "be[become] interested in", meaning: "~에 관심이[흥미가] 있다", root: "inter(사이에) + esse(있다) → 어떤 대상들 '사이에 함께 있고' 싶을 정도로 마음이 끌리고 관계를 맺고 싶어 하는 상태입니다.", cognates: "interest(관심, 이자), essence(본질)", group: "5. 진로 필수 구동사" }
    ];

    let currentCardIndex = 0;
    let isFlipped = false;
    let globalWordIndex = 0; // 아코디언 고유 ID 생성을 위한 전역 카운터

    function renderList() {
        const listView = document.getElementById('listView');
        let htmlContent = '';
        globalWordIndex = 0; // 렌더링 시 카운터 초기화
        
        // 데이터를 그룹별로 묶어줌
        const groupedData = wordData.reduce((acc, word) => {
            if (!acc[word.group]) acc[word.group] = [];
            acc[word.group].push(word);
            return acc;
        }, {});

        for (const [groupName, groupWords] of Object.entries(groupedData)) {
            // 그룹명에서 번호 제거하여 깔끔하게 표시
            const cleanGroupName = groupName.replace(/^\d+\.\s*/, '');
            
            htmlContent += `
                <div class="mb-8">
                    <h2 class="text-sm font-bold text-amber-500 uppercase tracking-widest mb-4 px-2 border-l-4 border-amber-500 pl-3 flex items-center">
                        <i class="fa-solid fa-briefcase text-xs mr-2 opacity-80"></i> ${cleanGroupName}
                    </h2>
                    <div class="space-y-3">
            `;
            
            groupWords.forEach((item) => {
                const id = `word-${globalWordIndex++}`; // 완벽한 고유 식별자 생성
                
                htmlContent += `
                    <div class="bg-slate-700 rounded-xl shadow-lg border border-slate-600 overflow-hidden transform transition hover:-translate-y-0.5 hover:border-amber-500">
                        <div class="p-4 flex justify-between items-center cursor-pointer hover:bg-slate-600 transition" onclick="toggleAccordion('${id}')">
                            <div class="pl-1">
                                <h3 class="text-lg font-bold text-white">${item.word}</h3>
                                <p class="text-[0.9rem] text-slate-300 mt-1 font-medium">${item.meaning}</p>
                            </div>
                            <div class="text-amber-500 w-9 h-9 flex items-center justify-center bg-slate-800 rounded-full shadow-inner border border-slate-600 mr-1">
                                <i id="icon-${id}" class="fa-solid fa-chevron-down transition-transform duration-300 text-xs"></i>
                            </div>
                        </div>
                        
                        <div id="content-${id}" class="accordion-content bg-slate-900 px-5 border-t border-slate-600/50">
                            <div class="mb-4 pt-2">
                                <span class="inline-block bg-amber-500/20 text-amber-400 text-[0.7rem] px-2 py-1 rounded-md font-bold mb-2 border border-amber-500/30">
                                    <i class="fa-solid fa-wand-magic-sparkles mr-1"></i>어원 스토리
                                </span>
                                <p class="text-[0.9rem] text-slate-300 leading-relaxed font-medium break-keep">${item.root}</p>
                            </div>
                            <div class="pb-3">
                                <span class="inline-block bg-slate-700 text-slate-300 text-[0.7rem] px-2 py-1 rounded-md font-bold mb-1 border border-slate-600">
                                    <i class="fa-solid fa-link mr-1"></i>패밀리 단어
                                </span>
                                <p class="text-[0.85rem] text-slate-400 font-semibold">${item.cognates}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
            htmlContent += `</div></div>`;
        }
        listView.innerHTML = htmlContent;
        updateFlashcard();
    }

    function toggleAccordion(id) {
        const content = document.getElementById(`content-${id}`);
        const icon = document.getElementById(`icon-${id}`);
        
        if (content.classList.contains('open')) {
            content.classList.remove('open');
            icon.classList.remove('rotate-180');
        } else {
            content.classList.add('open');
            icon.classList.add('rotate-180');
        }
    }

    function toggleMode() {
        const flashcardView = document.getElementById('flashcardView');
        const modeBtn = document.getElementById('modeToggleBtn');
        
        if (flashcardView.classList.contains('hidden')) {
            flashcardView.classList.remove('hidden');
            flashcardView.classList.add('flex');
            modeBtn.innerHTML = '<i class="fa-solid fa-list mr-1"></i> 목록보기';
            updateFlashcard();
        } else {
            flashcardView.classList.add('hidden');
            flashcardView.classList.remove('flex');
            modeBtn.innerHTML = '<i class="fa-solid fa-clone mr-1"></i> 카드모드';
        }
    }

    function updateFlashcard() {
        const item = wordData[currentCardIndex];
        const cleanGroupName = item.group.replace(/^\d+\.\s*/, '');
        
        document.getElementById('cardGroup').innerText = cleanGroupName;
        document.getElementById('cardWord').innerText = item.word;
        document.getElementById('cardWordBack').innerText = item.word;
        document.getElementById('cardMeaning').innerText = item.meaning;
        document.getElementById('cardRoot').innerText = item.root;
        document.getElementById('cardCognates').innerText = item.cognates;
        
        document.getElementById('flashcardCounter').innerText = `${currentCardIndex + 1} / ${wordData.length}`;
        
        if(isFlipped) {
            document.getElementById('flashcard').classList.remove('rotate-y-180');
            isFlipped = false;
        }
    }

    function flipCard() {
        const card = document.getElementById('flashcard');
        isFlipped = !isFlipped;
        if (isFlipped) {
            card.classList.add('rotate-y-180');
        } else {
            card.classList.remove('rotate-y-180');
        }
    }

    function prevCard() {
        currentCardIndex = (currentCardIndex > 0) ? currentCardIndex - 1 : wordData.length - 1;
        updateFlashcard();
    }

    function nextCard() {
        currentCardIndex = (currentCardIndex < wordData.length - 1) ? currentCardIndex + 1 : 0;
        updateFlashcard();
    }

    window.onload = () => {
        renderList();
    };
</script>
</body>
</html>
